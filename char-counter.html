<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글자 수 세기</title>
  <style>
    body {
      font-family: "Malgun Gothic", sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
    }
    textarea {
      width: 100%;
      height: 160px;
      padding: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      margin-top: 8px;
      padding: 8px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 16px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>글자 수 세기</h1>
  <textarea id="input" placeholder="여기에 글을 입력하세요"></textarea>
  <button id="countBtn">글자 수 세기</button>
  <p id="result"></p>

  <script>
    function showCount() {
      var text = document.getElementById("input").value;
      var count = Array.from(text).length;
      document.getElementById("result").textContent = "글자 수: " + count + "자";
    }

    document.getElementById("countBtn").addEventListener("click", showCount);
    document.getElementById("input").addEventListener("input", showCount);
  </script>
</body>
</html>
