<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 천문대</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; touch-action: none; }
    canvas { display: block; }
    #hint { position: fixed; left: 0; right: 0; top: 10px; text-align: center; color: #cfd6ff; font: 14px sans-serif; opacity: 0.8; pointer-events: none; }
    #count { position: fixed; left: 0; right: 0; top: 34px; text-align: center; color: #ffd98a; font: 16px sans-serif; pointer-events: none; }
    #linkBtn { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 14px 28px; font: 18px sans-serif; color: #2a1d05; background: #ffcc44; border: 0; border-radius: 28px; cursor: pointer; }
    #linkBtn.on { color: #ffe9a8; background: rgba(40, 32, 10, 0.85); border: 1px solid #ffcc44; }
    #soundBtn { position: fixed; right: 12px; top: 62px; padding: 8px 14px; font: 14px sans-serif; color: #cfd6ff; background: rgba(30, 36, 80, 0.8); border: 1px solid #5560a8; border-radius: 18px; cursor: pointer; }
    #photoBtn { position: fixed; left: 12px; top: 62px; padding: 8px 14px; font: 14px sans-serif; color: #cfd6ff; background: rgba(30, 36, 80, 0.8); border: 1px solid #5560a8; border-radius: 18px; cursor: pointer; }
    #eyepiece { position: fixed; inset: 0; display: none; pointer-events: none; background: radial-gradient(circle closest-side, transparent 85%, rgba(150, 170, 230, 0.22) 87.5%, rgba(0, 0, 0, 0.9) 91%, #000 100%); }
    #scopeBtn { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); display: none; padding: 10px 22px; font: 16px sans-serif; color: #dfe6ff; background: rgba(30, 36, 80, 0.85); border: 1px solid #7f8fe0; border-radius: 22px; cursor: pointer; white-space: nowrap; }
    #zoomBox { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; align-items: center; gap: 8px; color: #dfe6ff; font: 15px sans-serif; }
    #zoomBox button { width: 44px; height: 44px; border-radius: 22px; font: 22px sans-serif; color: #dfe6ff; background: rgba(30, 36, 80, 0.85); border: 1px solid #7f8fe0; cursor: pointer; }
    #conName { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%); display: none; padding: 6px 14px; font: 18px sans-serif; color: #fff3c4; background: rgba(10, 14, 40, 0.75); border: 1px solid rgba(191, 208, 255, 0.6); border-radius: 16px; pointer-events: none; white-space: nowrap; }
    #labelLayer { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
    #infoCard { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); display: none; width: max-content; max-width: min(86vw, 340px); padding: 10px 16px; font: 14px/1.45 sans-serif; color: #e8ecff; text-align: center; background: rgba(10, 14, 40, 0.85); border: 1px solid rgba(191, 208, 255, 0.5); border-radius: 14px; pointer-events: none; }
    #infoTitle { font: 700 17px sans-serif; color: #fff3c4; margin-bottom: 2px; }
    #people { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 240px); text-align: center; color: #cfd6ff; font: 13px/1.3 sans-serif; opacity: 0.85; pointer-events: none; }
    #timeBox { position: fixed; left: 12px; top: 104px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    #skyClock { font: 13px sans-serif; color: #cfd6ff; opacity: 0.9; padding-left: 2px; }
    #timeBox button { padding: 5px 10px; font: 12px sans-serif; color: #cfd6ff; background: rgba(30, 36, 80, 0.8); border: 1px solid #5560a8; border-radius: 14px; cursor: pointer; }
    #toast { position: fixed; left: 50%; top: 196px; transform: translateX(-50%); display: none; padding: 6px 14px; font: 14px sans-serif; color: #fff3c4; background: rgba(10, 14, 40, 0.8); border-radius: 14px; pointer-events: none; white-space: nowrap; }
    #zoomBox #zoomAll { font: 13px sans-serif; }
    #missionBtn { position: fixed; left: 12px; top: 50%; transform: translateY(-50%); display: none; padding: 8px 12px; font: 13px sans-serif; color: #2a1d05; background: #ffe9a8; border: 0; border-radius: 16px; cursor: pointer; }
    body.scope #missionBtn { display: block; }
    .turnBtn { position: fixed; bottom: 26px; width: 46px; height: 46px; border-radius: 23px; font: 22px sans-serif; color: #dfe6ff; background: rgba(30, 36, 80, 0.85); border: 1px solid #7f8fe0; cursor: pointer; }
    #turnLeft { left: 12px; }
    #turnRight { right: 12px; }
    body.scope .turnBtn { display: none; }
    #hint.mission { color: #ffe9a8; font: 700 15px sans-serif; opacity: 1; }
    body.scope #eyepiece { display: block; }
    body.scope #labelLayer { display: block; }
    body.scope #zoomBox { display: flex; }
  </style>
</head>
<body>
  <div id="eyepiece"></div>
  <canvas id="labelLayer"></canvas>
  <div id="conName"></div>
  <div id="infoCard"><div id="infoTitle"></div><div id="infoText"></div></div>
  <div id="hint">바닥을 누르거나 WASD · 방향키로 걷기</div>
  <div id="count">오늘 만든 별자리 0개</div>
  <div id="people">혼자 보는 중</div>
  <div id="toast"></div>
  <div id="timeBox">
    <div id="skyClock">하늘 11.25 21:00</div>
    <button id="speedBtn" type="button">▶ 실제 속도</button>
    <button id="nowBtn" type="button">지금 하늘</button>
  </div>
  <button id="linkBtn" type="button">별자리 잇기</button>
  <button id="soundBtn" type="button">소리 켜기</button>
  <button id="photoBtn" type="button">사진 저장</button>
  <button id="scopeBtn" type="button">망원경 보기</button>
  <button id="missionBtn" type="button">별자리 찾기</button>
  <button id="turnLeft" class="turnBtn" type="button" aria-label="화면 왼쪽으로 돌리기">↺</button>
  <button id="turnRight" class="turnBtn" type="button" aria-label="화면 오른쪽으로 돌리기">↻</button>
  <div id="zoomBox">
    <button id="zoomIn" type="button" aria-label="확대">+</button>
    <span id="zoomLabel">×2</span>
    <button id="zoomOut" type="button" aria-label="축소">−</button>
    <button id="zoomAll" type="button" aria-label="전체 보기">전체</button>
  </div>
  <script src="sky-data.js"></script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // 고정 난수: 새로고침해도, 누가 열어도 별과 먼 오름 자리가 같다
    let seed = 20261110;
    function makeRandom() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    // ---------- 장면 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070a1c);
    scene.fog = new THREE.Fog(0x070a1c, 25, 70);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x333a66, 0.8));
    const moon = new THREE.DirectionalLight(0x8899ff, 0.25);
    moon.position.set(-10, 20, 5);
    scene.add(moon);

    // 별빛: 하늘 쪽은 푸르스름하게, 땅 쪽은 어둡게 비춘다
    scene.add(new THREE.HemisphereLight(0x5566aa, 0x1a2418, 2.2));

    // 오름: 걸어 다니는 꼭대기는 평평하고, 그 바깥은 완만하게 내려간다
    const TOP_R = 37;       // 평평한 꼭대기 반지름(걷는 끝 35보다 조금 넓게)
    const HILL_R = 90;      // 오름 자락 끝
    const HILL_DROP = 16;   // 꼭대기에서 자락 끝까지 내려가는 높이
    function getHillHeight(r) {
      if (r <= TOP_R) return 0;
      const k = Math.min(1, (r - TOP_R) / (HILL_R - TOP_R));
      return -HILL_DROP * k * k * (3 - 2 * k);
    }
    const hillGeo = new THREE.RingGeometry(0, HILL_R, 96, 48);
    const hillPos = hillGeo.attributes.position;
    for (let i = 0; i < hillPos.count; i++) {
      hillPos.setZ(i, getHillHeight(Math.hypot(hillPos.getX(i), hillPos.getY(i))));
    }
    hillGeo.computeVertexNormals();
    const ground = new THREE.Mesh(
      hillGeo,
      new THREE.MeshStandardMaterial({ color: 0x1d2a1a, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 멀리 보이는 다른 오름들: 지평선의 별을 가리는 검은 능선
    const farHillGeo = new THREE.SphereGeometry(1, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    const farHillMat = new THREE.MeshBasicMaterial({ color: 0x03050b, fog: false });
    const farHills = new THREE.Group();   // 망원경 화면에서 한꺼번에 숨기려고 묶어 둔다
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + makeRandom() * 0.3;
      const farHill = new THREE.Mesh(farHillGeo, farHillMat);
      farHill.scale.set(18 + makeRandom() * 14, 14 + makeRandom() * 12, 8);
      farHill.position.set(Math.cos(a) * 84, -HILL_DROP, Math.sin(a) * 84);
      farHill.rotation.y = Math.PI / 2 - a;
      farHills.add(farHill);
    }
    scene.add(farHills);

    // 글씨 무늬: [글자, 색] 조각을 가운데 맞춰 이어 쓴 그림(코드로 그린다). bg가 있으면 둥근 천 조각 위에 쓴다
    function makeTextTexture(parts, width, height, font, bg) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const g = canvas.getContext('2d');
      if (bg) {
        const r = height * 0.28;
        const m = height * 0.06;
        g.beginPath();
        g.moveTo(m + r, m);
        g.arcTo(width - m, m, width - m, height - m, r);
        g.arcTo(width - m, height - m, m, height - m, r);
        g.arcTo(m, height - m, m, m, r);
        g.arcTo(m, m, width - m, m, r);
        g.closePath();
        g.fillStyle = bg;
        g.fill();
      }
      g.font = font;
      g.textBaseline = 'middle';
      const total = parts.reduce((w, [text]) => w + g.measureText(text).width, 0);
      // 글씨가 그림 너비의 88%를 넘으면 줄여서 양 끝이 잘리지 않게 한다
      const fit = Math.min(1, (width * 0.88) / total);
      g.translate(width / 2, height / 2);
      g.scale(fit, fit);
      let x = -total / 2;
      for (const [text, color] of parts) {
        g.fillStyle = color;
        g.fillText(text, x, 0);
        x += g.measureText(text).width;
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }
    // 세로 글씨 무늬: 아래에서 위로 읽히게 돌려 쓰고, 그림 높이의 90%에 맞춰 글자 크기를 정한다
    function makeSideTextTexture(text, color, width, height, fontFamily) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const g = canvas.getContext('2d');
      g.font = '700 100px ' + fontFamily;
      const size = Math.min(width * 0.62, 100 * (height * 0.9) / g.measureText(text).width);
      g.font = '700 ' + size + 'px ' + fontFamily;
      g.fillStyle = color;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.translate(width / 2, height / 2);
      g.rotate(-Math.PI / 2);
      g.fillText(text, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    // 망원경: VESPERA II처럼 흰 둥근 몸통 옆에 경통이 붙은 스마트 망원경, 짧은 검은 삼발이
    const telescope = new THREE.Group();
    const vespera = new THREE.Group();
    const shellMat = new THREE.MeshStandardMaterial({ color: 0xf2f4f7, metalness: 0.05, roughness: 0.35 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x14161b, metalness: 0.3, roughness: 0.3 });
    const VESPERA_SIZE = 1.2;   // 망원경 전체 크기
    const HUB_Y = 0.4;          // 삼발이 위 받침 높이
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
      const top = new THREE.Vector3(0, HUB_Y, 0);
      const foot = new THREE.Vector3(Math.cos(a) * 0.5, 0, Math.sin(a) * 0.5);
      const dir = top.clone().sub(foot);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, dir.length(), 8), blackMat);
      leg.position.copy(foot).add(top).multiplyScalar(0.5);
      leg.quaternion.setFromUnitVectors(up, dir.normalize());
      vespera.add(leg);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.08, 16), blackMat);
    hub.position.y = HUB_Y;
    vespera.add(hub);

    // 방위로 도는 부분: 둥근 기둥 몸통, 아래로 휜 발, 파란 링 불빛, 몸통 글씨, 옆에 붙은 경통
    const scopeTurn = new THREE.Group();
    const column = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 1.0, 8, 24), shellMat);
    column.position.y = HUB_Y + 0.76;
    column.scale.z = 0.7;
    scopeTurn.add(column);
    const bodyFoot = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.24, 8, 16), shellMat);
    bodyFoot.rotation.z = Math.PI / 2;
    bodyFoot.position.set(0.2, HUB_Y + 0.22, 0);
    bodyFoot.scale.z = 0.7;
    scopeTurn.add(bodyFoot);
    const ledRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.075, 0.012, 8, 32),
      new THREE.MeshBasicMaterial({ color: 0x5cc8ff })
    );
    ledRing.position.set(-0.262, HUB_Y + 1.2, 0);
    ledRing.rotation.y = Math.PI / 2;
    scopeTurn.add(ledRing);
    // 몸통 옆면(파란 링 쪽)을 둘러싸는 큰 세로 글씨. 몸통과 같은 곡면이라 어느 각도에서도 떠 보이지 않는다
    const nameTex = makeSideTextTexture('VESPERA II', '#1f2636', 512, 1100, '"Segoe UI", "Helvetica Neue", Arial, sans-serif');
    const nameLabel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.263, 0.263, 0.98, 32, 1, true, Math.PI * 1.5 - 0.9, 1.8),
      new THREE.MeshStandardMaterial({ map: nameTex, transparent: true, depthWrite: false })
    );
    nameLabel.position.y = HUB_Y + 0.76;
    nameLabel.scale.z = 0.7;   // 몸통처럼 앞뒤로 납작하게
    scopeTurn.add(nameLabel);
    const joint = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.1, 20), shellMat);
    joint.rotation.z = Math.PI / 2;
    joint.position.set(0.31, HUB_Y + 1.22, 0);
    scopeTurn.add(joint);

    // 경통: 뒤쪽은 흰 둥근 통, 앞쪽은 검은 통, 끝에 렌즈. 옆 축을 중심으로 고도만큼 들린다
    const tubePivot = new THREE.Group();
    tubePivot.position.set(0.47, HUB_Y + 1.22, 0);
    const tubeBack = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.45, 8, 24), shellMat);
    tubeBack.position.y = -0.1;
    tubePivot.add(tubeBack);
    const tubeFront = new THREE.Mesh(new THREE.CylinderGeometry(0.178, 0.178, 0.55, 24), blackMat);
    tubeFront.position.y = 0.42;
    tubePivot.add(tubeFront);
    const lens = new THREE.Mesh(
      new THREE.CircleGeometry(0.14, 24),
      new THREE.MeshBasicMaterial({ color: 0x2a3d70 })
    );
    lens.rotation.x = -Math.PI / 2;
    lens.position.y = 0.70;
    tubePivot.add(lens);
    scopeTurn.add(tubePivot);
    vespera.add(scopeTurn);
    vespera.scale.setScalar(VESPERA_SIZE);
    telescope.add(vespera);

    // 망원경이 향한 방위(북 0, 동쪽으로 +)와 고도. 처음에는 북서쪽 하늘 45도(고니자리 쪽)를 본다
    let telescopeAz = 0;
    let telescopeAlt = 0;
    function aimTelescope(az, alt) {
      telescopeAz = az;
      telescopeAlt = alt;
      scopeTurn.rotation.y = -az;
      tubePivot.rotation.x = -(Math.PI / 2 - alt);
    }
    aimTelescope(297 * Math.PI / 180, Math.PI / 4);

    const basaltGeo = new THREE.DodecahedronGeometry(0.22);
    const basaltMat = new THREE.MeshStandardMaterial({ color: 0x2c2f36, roughness: 1 });
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const stone = new THREE.Mesh(basaltGeo, basaltMat);
      stone.position.set(Math.cos(a) * 1.45, 0.06, Math.sin(a) * 1.45);
      stone.scale.y = 0.45;
      telescope.add(stone);
    }

    // 관측할 때 쓰는 작은 붉은 등: 눈부시지 않게 받침 주변만 비춘다
    const redLamp = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xff4a3a })
    );
    redLamp.position.set(1.15, 0.1, 0.75);
    telescope.add(redLamp);
    const redLight = new THREE.PointLight(0xff4433, 1.5, 5, 2);   // 흰 망원경이 분홍빛으로 물들지 않게 멀리·약하게
    redLight.position.set(1.15, 0.25, 0.75);
    telescope.add(redLight);
    scene.add(telescope);

    // 별: 코드로 그린 둥근 빛 무늬로 별마다 빛이 번지게 한다
    function makeGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      const g = canvas.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.18, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.45, 'rgba(255,255,255,0.15)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const glowTex = makeGlowTexture();
    const STAR_R = 90;
    const sky = new THREE.Group();

    // 관측 자리와 시각: 2026년 11월 25일 밤 9시(한국 시각), 제주(북위 33.4도, 동경 126.5도)
    const OBS_LAT = 33.4 * Math.PI / 180;
    const START_LST = 11.1 * Math.PI / 180;      // 그 시각의 지방 항성시(약 0시 44분)
    const OBS_LON_DEG = 126.53;                  // 제주 동경(도)
    // 하늘의 북극 방향: 북쪽(-z)에서 위도만큼 들려 있다. 하늘은 이 축을 중심으로 돈다
    const POLE_AXIS = new THREE.Vector3(0, Math.sin(OBS_LAT), -Math.cos(OBS_LAT));

    // 적경·적위(도)를 시작 시각의 하늘 방향으로 바꾼다. 동쪽 +x, 위 +y, 북쪽 -z
    function getSkyDir(raDeg, decDeg) {
      const dec = decDeg * Math.PI / 180;
      const hourAngle = START_LST - raDeg * Math.PI / 180;
      const toMeridian = Math.cos(dec) * Math.cos(hourAngle);
      const toEast = -Math.cos(dec) * Math.sin(hourAngle);
      const toPole = Math.sin(dec);
      const north = -toMeridian * Math.sin(OBS_LAT) + toPole * Math.cos(OBS_LAT);
      const up = toMeridian * Math.cos(OBS_LAT) + toPole * Math.sin(OBS_LAT);
      return new THREE.Vector3(toEast, up, -north);
    }

    // B-V 색지수로 별빛 색을 정한다(파란 별 ~ 붉은 별)
    const BV_COLORS = [[-0.3, 0x9bb0ff], [0, 0xcad7ff], [0.3, 0xf8f7ff], [0.6, 0xfff4e8], [1.0, 0xffd2a1], [1.5, 0xffb46b], [2.0, 0xff9a50]];
    const colorA = new THREE.Color();
    const colorB = new THREE.Color();
    function getStarColor(bv, out) {
      const k = BV_COLORS.findIndex(([v]) => bv < v);
      if (k <= 0) return out.setHex(BV_COLORS[k === 0 ? 0 : BV_COLORS.length - 1][1]);
      const [v0, c0] = BV_COLORS[k - 1];
      const [v1, c1] = BV_COLORS[k];
      return out.lerpColors(colorA.setHex(c0), colorB.setHex(c1), (bv - v0) / (v1 - v0));
    }

    // 자리·색 배열로 빛나는 점 묶음을 만들어 하늘에 붙인다
    function makePoints(pos, col, size, opacity) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      const points = new THREE.Points(geo, new THREE.PointsMaterial({
        size, map: glowTex, vertexColors: true, transparent: true, opacity,
        depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      }));
      sky.add(points);
      return points;
    }

    // 실제 별(6등급까지): 등급 묶음마다 크기와 밝기를 달리한다
    const MAG_LAYERS = [
      { maxMag: 1.5, size: 4.2, opacity: 1 },
      { maxMag: 2.5, size: 3.2, opacity: 1 },
      { maxMag: 3.5, size: 2.4, opacity: 0.95 },
      { maxMag: 4.5, size: 1.7, opacity: 0.85 },
      { maxMag: 5.2, size: 1.3, opacity: 0.8 },
      { maxMag: 99, size: 1.0, opacity: 0.65 },
    ];
    const PICK_MAX_MAG = 4;     // 별자리 잇기로 고를 수 있는 가장 어두운 등급
    const pickableStars = [];   // 고를 수 있는 별(하늘 묶음 기준 자리)
    const layerPos = MAG_LAYERS.map(() => []);
    const layerCol = MAG_LAYERS.map(() => []);
    const starColor = new THREE.Color();
    const starData = window.SKY_DATA.stars;
    for (let i = 0; i < starData.length; i += 4) {
      const mag = starData[i + 2];
      const pos = getSkyDir(starData[i], starData[i + 1]).multiplyScalar(STAR_R);
      const k = MAG_LAYERS.findIndex((l) => mag <= l.maxMag);
      layerPos[k].push(pos.x, pos.y, pos.z);
      getStarColor(starData[i + 3], starColor);
      layerCol[k].push(starColor.r, starColor.g, starColor.b);
      if (mag <= PICK_MAX_MAG) pickableStars.push(pos);
    }
    const starLayers = MAG_LAYERS.map((l, k) => makePoints(layerPos[k], layerCol[k], l.size, l.opacity));

    // 은하수: 실제 은하면(은하 북극 적경 192.86도, 적위 27.13도)을 따라 흐린 빛과 작은 별을 뿌린다
    const bandNormal = getSkyDir(192.86, 27.13);
    const bandU = new THREE.Vector3(1, 0, 0).cross(bandNormal).normalize();
    const bandV = bandNormal.clone().cross(bandU);
    function pickBandDir(spread) {
      const a = makeRandom() * Math.PI * 2;
      const off = (makeRandom() + makeRandom() + makeRandom() - 1.5) * spread;
      return bandU.clone().multiplyScalar(Math.cos(a))
        .addScaledVector(bandV, Math.sin(a))
        .addScaledVector(bandNormal, off)
        .normalize();
    }
    function makeBandLayer(count, size, opacity, spread, colors) {
      const pos = [];
      const col = [];
      const c = new THREE.Color();
      for (let i = 0; i < count; i++) {
        const d = pickBandDir(spread);
        pos.push(d.x * STAR_R, d.y * STAR_R, d.z * STAR_R);
        c.setHex(colors[Math.floor(makeRandom() * colors.length)]);
        col.push(c.r, c.g, c.b);
      }
      makePoints(pos, col, size, opacity);
    }
    makeBandLayer(800, 9, 0.05, 0.18, [0x9fb4ff, 0xc8d4ff, 0xe8e0ff]);   // 은하수의 뿌연 빛
    makeBandLayer(4500, 0.6, 0.4, 0.12, [0xdfe8ff, 0xffffff, 0xfff2d6]); // 은하수의 작은 별
    scene.add(sky);

    // 하늘은 북극 축을 중심으로 실제 속도로 돌고, 밝은 별은 서로 다른 박자로 반짝인다
    function updateStars(t) {
      sky.quaternion.setFromAxisAngle(POLE_AXIS, -getSkyAngle());   // 하늘 시각만큼 돈다(아래 '하늘 시각' 부분)
      starLayers[0].material.opacity = 0.88 + Math.sin(t * 2.6 + 1) * 0.12;
      starLayers[1].material.opacity = 0.86 + Math.sin(t * 1.7) * 0.12;
    }

    // ---------- 인형 ----------
    // 등 무늬: 흰 천 조각 위에 굵고 크게 써서 멀리서도 읽히게 한다
    const shirtPrintTex = makeTextTexture(
      [['MARUS', '#111111'], ['Y', '#1ea7e1'], ['S', '#111111'], [' edu', '#1ea7e1']],
      1024, 410, '700 170px "Segoe UI", "Helvetica Neue", Arial, sans-serif', 'rgba(250, 250, 252, 0.95)'
    );
    function makeDoll(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 20, 16),
        new THREE.MeshStandardMaterial({ color })
      );
      body.position.y = 0.5;
      body.scale.y = 1.15;
      g.add(body);
      // 눈사람 아랫부분 등쪽(-z)에 옷 무늬처럼 MARUSYS edu 글씨를 두른다(몸에 붙여 같이 늘어나고 돈다)
      const shirtPrint = new THREE.Mesh(
        new THREE.SphereGeometry(0.455, 40, 8, Math.PI * 1.5 - 0.95, 1.9, Math.PI / 2 - 0.33, 0.66),
        new THREE.MeshStandardMaterial({
          map: shirtPrintTex, transparent: true, depthWrite: false,
          emissive: 0xffffff, emissiveMap: shirtPrintTex, emissiveIntensity: 0.3,   // 어두운 밤에도 글씨가 보이게 살짝 빛낸다
        })
      );
      body.add(shirtPrint);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 20, 16),
        new THREE.MeshStandardMaterial({ color: 0xffd9b8 })
      );
      head.position.y = 1.25;
      g.add(head);
      return g;
    }
    const me = makeDoll(0xe8643c);
    me.position.set(0, 0, 5);
    me.rotation.y = Math.PI;   // 처음부터 망원경 쪽을 보고 서서, 카메라에 등 무늬가 보이게 한다
    scene.add(me);

    // ---------- 걷기 ----------
    const SPEED = 2;      // 1초에 걷는 거리(천천히)
    const CLICK_STEP = 8; // 한 번 눌러서 걷는 가장 먼 거리
    const DOLL_TURN = 6;  // 인형이 돌아서는 빠르기(클수록 빨리)
    const WALK_R = 35;    // 걸을 수 있는 바깥 끝
    const FIRE_R = 1.7;   // 모닥불 돌 둘레, 이 안으로는 못 들어간다
    const MOVE_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowLeft', 'ArrowDown', 'ArrowRight'];
    const keys = {};
    let target = null;    // 바닥을 눌러 정한 목적지
    let keysHeld = false; // 방향키를 누르고 있는 중인지
    let keyYaw = 0;       // 방향키를 처음 누른 순간의 카메라 방향(그 동안은 이 방향 기준으로 걷는다)

    addEventListener('keydown', (e) => {
      if (!MOVE_KEYS.includes(e.code)) return;
      keys[e.code] = true;
      target = null;
    });
    addEventListener('keyup', (e) => { keys[e.code] = false; });
    // 창을 벗어나면 누르고 있던 키를 모두 뗀 것으로 본다
    addEventListener('blur', () => { for (const k of MOVE_KEYS) keys[k] = false; });

    // 자리를 걸을 수 있는 곳(불 바깥, 캠핑장 안)으로 옮긴다
    function keepInWalkArea(pos) {
      const r = Math.hypot(pos.x, pos.z);
      if (r > WALK_R) {
        pos.x *= WALK_R / r;
        pos.z *= WALK_R / r;
      } else if (r < 0.001) {
        pos.x = 0;
        pos.z = FIRE_R;
      } else if (r < FIRE_R) {
        pos.x *= FIRE_R / r;
        pos.z *= FIRE_R / r;
      }
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function pickGround(clientX, clientY) {
      pointer.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(ground)[0];
      if (hit) {
        target = hit.point.clone();
      } else {
        // 하늘처럼 바닥이 아닌 곳을 누르면 그 방향으로 걷는다(거리는 아래에서 CLICK_STEP으로 줄인다)
        const dir = raycaster.ray.direction;
        const len = Math.hypot(dir.x, dir.z);
        if (len < 0.001) return;
        const dx = dir.x / len, dz = dir.z / len;
        const b = me.position.x * dx + me.position.z * dz;
        const c = me.position.x * me.position.x + me.position.z * me.position.z - WALK_R * WALK_R;
        const far = -b + Math.sqrt(Math.max(0, b * b - c));
        target = new THREE.Vector3(me.position.x + dx * far, 0, me.position.z + dz * far);
      }
      // 한 번 누르면 그 방향으로 CLICK_STEP까지만 걷는다
      const vx = target.x - me.position.x;
      const vz = target.z - me.position.z;
      const dist = Math.hypot(vx, vz);
      if (dist > CLICK_STEP) {
        target.x = me.position.x + vx / dist * CLICK_STEP;
        target.z = me.position.z + vz / dist * CLICK_STEP;
      }
      keepInWalkArea(target);
    }
    // 마우스와 휴대폰 터치 모두 pointerdown 하나로 처리한다(망원경 화면에서는 끌기, 별자리 잇기 중에는 별 고르기)
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (scopeOn) startScopeDrag(e);
      else if (linking) pickStar(e.clientX, e.clientY);
      else pickGround(e.clientX, e.clientY);
    });

    function updateMe(dt) {
      let step = SPEED * dt;
      let dx = 0, dz = 0;
      let kx = 0, kz = 0;   // kx: 화면 오른쪽, kz: 화면 위쪽
      if (keys.KeyW || keys.ArrowUp) kz += 1;
      if (keys.KeyS || keys.ArrowDown) kz -= 1;
      if (keys.KeyA || keys.ArrowLeft) kx -= 1;
      if (keys.KeyD || keys.ArrowRight) kx += 1;
      if (!kx && !kz) keysHeld = false;
      if (kx || kz) {
        // 키를 처음 누른 순간의 화면 위쪽(f)을 기준으로 걷는다. 걷는 사이 카메라가 돌아도 방향이 휘지 않아 맴돌지 않는다
        if (!keysHeld) keyYaw = camYawTarget;
        keysHeld = true;
        const fx = -Math.sin(keyYaw);
        const fz = -Math.cos(keyYaw);
        dx = fx * kz - fz * kx;
        dz = fz * kz + fx * kx;
        const len = Math.hypot(dx, dz);
        dx /= len;
        dz /= len;
      } else if (target) {
        const vx = target.x - me.position.x, vz = target.z - me.position.z;
        const d = Math.hypot(vx, vz);
        if (d < 0.05) {
          target = null;
        } else {
          dx = vx / d;
          dz = vz / d;
          step = Math.min(step, d);
        }
      }
      if (dx || dz) {
        const oldX = me.position.x, oldZ = me.position.z;
        me.position.x += dx * step;
        me.position.z += dz * step;
        keepInWalkArea(me.position);
        // 가는 방향으로 홱 돌지 않고 부드럽게 돌아선다
        const wantRot = Math.atan2(dx, dz);
        const turn = Math.atan2(Math.sin(wantRot - me.rotation.y), Math.cos(wantRot - me.rotation.y));
        me.rotation.y += turn * (1 - Math.exp(-DOLL_TURN * dt));
        // 불이나 가장자리에 막혀 거의 못 움직이면 목적지를 지운다
        const went = Math.hypot(me.position.x - oldX, me.position.z - oldZ);
        if (target && went < step * 0.1) target = null;
      }
    }

    // ---------- 카메라 ----------
    const CAM_BACK = 8, CAM_UP = 4.5;
    const CAM_STEP = Math.PI / 4;   // 버튼·Q/E 한 번에 도는 각도(45도)
    let camYaw = 0;         // 인형에서 본 카메라 쪽 방향(처음에는 +z 쪽, 화면 위쪽이 북쪽)
    let camYawTarget = 0;   // 사용자가 돌린 목표 방향. 카메라는 스스로 돌지 않고 이 값만 따른다
    const camWant = new THREE.Vector3();
    // 화면 돌리기: 사용자가 누를 때만 45도씩 돈다(+1 왼쪽, -1 오른쪽)
    function turnCamera(dir) {
      camYawTarget += dir * CAM_STEP;
    }
    document.getElementById('turnLeft').addEventListener('click', () => turnCamera(1));
    document.getElementById('turnRight').addEventListener('click', () => turnCamera(-1));
    addEventListener('keydown', (e) => {
      if (scopeOn || e.repeat) return;
      if (e.code === 'KeyQ') turnCamera(1);
      if (e.code === 'KeyE') turnCamera(-1);
    });
    // 걷는 동안 망원경이 화면 밖으로 나가려 하면 그만큼만 돌려 화면 가장자리 안에 남긴다(서 있을 땐 돌지 않는다)
    const KEEP_TURN = 1.4;     // 망원경을 붙잡으려고 도는 가장 빠른 속도(1초에 약 80도)
    const KEEP_INSIDE = 0.65;  // 화면 가운데에서 가장자리까지의 65% 안쪽에 망원경을 둔다
    const KEEP_AHEAD = 3;      // 망원경이 카메라 앞으로 이 거리보다 가까우면(발밑·뒤) 보이지 않는 것으로 본다
    let lastDollX = me.position.x;
    let lastDollZ = me.position.z;
    function keepTelescopeInView(dt) {
      const moved = Math.hypot(me.position.x - lastDollX, me.position.z - lastDollZ) > 1e-4;
      lastDollX = me.position.x;
      lastDollZ = me.position.z;
      if (!moved) return;
      // 지금 카메라 자리에서 본 앞 방향(인형 쪽)과 망원경(원점) 방향의 차이
      const cx = camera.position.x;
      const cz = camera.position.z;
      const forwardYaw = Math.atan2(cx - me.position.x, cz - me.position.z);
      const toYaw = Math.atan2(cx, cz);   // 카메라에서 원점을 보는 방향(앞 방향과 같은 셈법)
      const off = Math.atan2(Math.sin(toYaw - forwardYaw), Math.cos(toYaw - forwardYaw));
      const ahead = Math.hypot(cx, cz) * Math.cos(off);
      const halfView = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect) * KEEP_INSIDE;
      const outside = Math.abs(off) - Math.max(0.1, halfView);
      if (outside <= 0 && ahead >= KEEP_AHEAD) return;
      const need = outside > 0 ? outside : KEEP_TURN * dt;
      camYawTarget += Math.sign(off || 1) * Math.min(need, KEEP_TURN * dt);
    }
    function updateCamera(dt) {
      // 카메라는 스스로 방향을 바꾸지 않고 인형 뒤를 따라 미끄러지듯 움직인다.
      // 돌리는 때는 두 가지뿐: 사용자가 ↺·↻·Q·E를 누를 때, 걷다가 망원경이 화면 밖으로 나가려 할 때
      keepTelescopeInView(dt);
      camYaw += (camYawTarget - camYaw) * (1 - Math.exp(-6 * dt));
      camWant.set(
        me.position.x + Math.sin(camYaw) * CAM_BACK,
        CAM_UP,
        me.position.z + Math.cos(camYaw) * CAM_BACK
      );
      camera.position.lerp(camWant, 1 - Math.exp(-3 * dt));
      camera.lookAt(me.position.x, 1.2, me.position.z);
    }

    // ---------- 별자리 잇기 ----------
    const LINK_COUNT = 10;    // 한 별자리에 잇는 별 수
    const LINK_LIFE = 10;     // 완성한 별자리가 보이는 시간(초)
    const LINK_FADE = 2;      // 사라지기 전에 흐려지는 시간(초)
    const PICK_PX = 28;       // 누른 곳에서 이 거리(px) 안의 별만 고른다
    const GOLD = 0xffcc44;
    const linkBtn = document.getElementById('linkBtn');
    const countEl = document.getElementById('count');
    const hintEl = document.getElementById('hint');
    const HINT_WALK = hintEl.textContent;

    // 오늘 만든 별자리 수·찾은 별자리 수: 날짜마다 따로 브라우저에 저장한다(kind: constellations, found)
    function getTodayKey(kind = 'constellations') {
      const d = new Date();
      return 'space-' + kind + '-' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function loadTodayCount(kind) {
      try {
        return parseInt(localStorage.getItem(getTodayKey(kind)) || '0', 10) || 0;
      } catch (e) {
        console.warn('오늘 별자리 수를 읽지 못했습니다.', e);
        return 0;
      }
    }
    function saveTodayCount(n, kind) {
      try {
        localStorage.setItem(getTodayKey(kind), String(n));
      } catch (e) {
        console.warn('오늘 별자리 수를 저장하지 못했습니다.', e);
      }
    }
    // 저장소를 못 쓰는 브라우저에서도 열려 있는 동안은 숫자가 오르도록 메모리에도 둔다
    let todayCount = loadTodayCount();
    let foundCount = loadTodayCount('found');   // 별자리 찾기 미션에서 오늘 찾은 수
    function showCount() {
      countEl.textContent = '오늘 만든 별자리 ' + todayCount + '개' + (foundCount ? ' · 찾은 별자리 ' + foundCount + '개' : '');
    }
    showCount();

    const screenPos = new THREE.Vector3();
    // 누른 화면 자리에서 가장 가까운 별을 찾는다(PICK_PX 밖이면 없음)
    function findStarAt(clientX, clientY) {
      let best = null;
      let bestD = PICK_PX;
      for (const star of pickableStars) {
        screenPos.copy(star).applyMatrix4(sky.matrixWorld).project(camera);
        if (screenPos.z > 1) continue;   // 카메라 뒤쪽 별
        const sx = (screenPos.x + 1) / 2 * innerWidth;
        const sy = (1 - screenPos.y) / 2 * innerHeight;
        const d = Math.hypot(sx - clientX, sy - clientY);
        if (d < bestD) {
          bestD = d;
          best = star;
        }
      }
      return best;
    }

    // 별자리 하나: 하늘 묶음에 붙여서 별과 함께 천천히 돈다
    function makeConstellation() {
      const group = new THREE.Group();
      const lineMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, fog: false, depthWrite: false });
      const markMat = new THREE.PointsMaterial({
        color: GOLD, size: 3.6, map: glowTex, transparent: true, fog: false,
        depthWrite: false, blending: THREE.AdditiveBlending,
      });
      sky.add(group);
      return { group, lineMat, markMat, stars: [], endAt: 0 };
    }
    function addMark(c, star) {
      c.group.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints([star]), c.markMat));
    }
    // 두 별 사이에 가는 금색 막대를 놓아 선을 긋는다
    function addSegment(c, from, to) {
      const dir = to.clone().sub(from);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, dir.length(), 6), c.lineMat);
      bar.position.copy(from).add(to).multiplyScalar(0.5);
      bar.quaternion.setFromUnitVectors(up, dir.normalize());
      c.group.add(bar);
    }
    function removeConstellation(c) {
      sky.remove(c.group);
      c.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      c.lineMat.dispose();
      c.markMat.dispose();
    }

    let linking = false;      // 별자리 잇기 중인지
    let current = null;       // 지금 잇고 있는 별자리
    const finished = [];      // 다 이어서 사라지기를 기다리는 별자리
    let nowT = 0;             // 반복에서 받은 지금 시각(초)

    function updateLinkUi() {
      linkBtn.textContent = linking ? '잇기 취소' : '별자리 잇기';
      linkBtn.classList.toggle('on', linking);
      const missionShown = !linking && scopeOn && mission;
      hintEl.textContent = linking
        ? '하늘의 별을 차례로 누르세요 (' + current.stars.length + '/' + LINK_COUNT + ')'
        : (missionShown ? mission.text : (scopeOn ? HINT_SCOPE : HINT_WALK));
      hintEl.classList.toggle('mission', Boolean(missionShown));
    }
    function startLinking() {
      linking = true;
      current = makeConstellation();
      updateLinkUi();
    }
    function cancelLinking() {
      removeConstellation(current);
      current = null;
      linking = false;
      updateLinkUi();
    }
    function finishLinking() {
      current.endAt = nowT + LINK_LIFE;
      finished.push(current);
      current = null;

          const a = makeRandom() * Math.PI * 2;
          const r = Math.pow(makeRandom(), 1.6) * spread;
          g.globalAlpha = 0.5 + makeRandom() * 0.5;
          g.beginPath();
          g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, size * (0.6 + makeRandom()), 0, Math.PI * 2);
          g.fill();
        }
        g.globalAlpha = 1;
      };

        g.translate(c, c);
        g.rotate(angleDeg * Math.PI / 180);
        g.scale(1, 0.32);
        glow(0, 0, c * 0.95, color + 'aa', color + '00');

      let bestD = NAME_PICK_PX;
      for (const c of constellations) {
        const p = c.line.geometry.attributes.position;
        for (let i = 0; i < p.count; i += 2) {
          if (!getScreenPoint(segA.fromBufferAttribute(p, i), segA)) continue;
          if (!getScreenPoint(segB.fromBufferAttribute(p, i + 1), segB)) continue;
          const d = getDistanceToSegment(clientX, clientY, segA, segB);
          if (d < bestD) {
            bestD = d;
            best = c;
          }
        }
      }
      return best;
    }
    // 같은 이름의 조각(뱀자리 머리·꼬리)까지 함께 밝히고 이름을 띄운다
    function lightConstellation(ko) {
      for (const c of constellations) {
        const lit = c.ko === ko;
        c.line.material.color.setHex(lit ? LINE_LIT_COLOR : LINE_COLOR);
        c.line.material.opacity = lit ? 0.95 : 0.35;
      }
    }
    function showConstellationName(c) {
      lightConstellation(c.ko);
      shownName = { ko: c.ko, label: c.label, endAt: nowT + NAME_SHOW };
      conNameEl.textContent = c.ko;
    }
    function hideConstellationName() {
      shownName = null;
      lightConstellation(cardKo);   // 설명 카드가 떠 있는 별자리는 계속 밝혀 둔다
      conNameEl.style.display = 'none';
    }
    // 이름표는 별자리 이름 자리를 따라다니고, 3초가 지나면 사라진다
    function updateConstellationName() {
      if (!shownName) return;
      if (nowT > shownName.endAt) {
        hideConstellationName();
        return;
      }
      const onScreen = getScreenPoint(shownName.label, labelPos);
      conNameEl.style.display = onScreen ? 'block' : 'none';
      if (!onScreen) return;
      conNameEl.style.left = Math.max(70, Math.min(innerWidth - 70, labelPos.x)) + 'px';
      conNameEl.style.top = Math.max(80, Math.min(innerHeight - 140, labelPos.y)) + 'px';
    }

    // ---- 별자리 지도: 둥근 시야 안 별자리 이름을 겹치지 않게 모두 쓴다 ----
    const labelCanvas = document.getElementById('labelLayer');
    const labelCtx = labelCanvas.getContext('2d');
    function drawConstellationLabels() {
      const dpr = Math.min(devicePixelRatio, 2);
      const w = Math.round(innerWidth * dpr);
      const h = Math.round(innerHeight * dpr);
      if (labelCanvas.width !== w || labelCanvas.height !== h) {
        labelCanvas.width = w;
        labelCanvas.height = h;
      }
      labelCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      labelCtx.clearRect(0, 0, innerWidth, innerHeight);
      labelCtx.font = '13px sans-serif';
      labelCtx.textAlign = 'center';
      labelCtx.textBaseline = 'middle';
      labelCtx.fillStyle = 'rgba(200, 214, 255, 0.8)';
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      const inside = Math.min(innerWidth, innerHeight) / 2 * 0.84;   // 둥근 시야 안쪽만
      const placed = [];
      const done = new Set();
      for (const c of labelOrder) {
        if (done.has(c.ko) || (shownName && shownName.ko === c.ko)) continue;
        if (!getScreenPoint(c.label, labelPos)) continue;
        if (Math.hypot(labelPos.x - cx, labelPos.y - cy) > inside) continue;
        const half = labelCtx.measureText(c.ko).width / 2 + 4;
        const box = [labelPos.x - half, labelPos.y - 10, labelPos.x + half, labelPos.y + 10];
        if (placed.some((b) => b[0] < box[2] && box[0] < b[2] && b[1] < box[3] && box[1] < b[3])) continue;
        placed.push(box);
        done.add(c.ko);
        labelCtx.fillText(c.ko, labelPos.x, labelPos.y);
      }
      // 조금 확대하면(×2부터) 성운·은하 이름도 옅은 초록으로 쓴다
      if (scopeDiam > SCOPE_FOVS[2]) return;
      labelCtx.fillStyle = 'rgba(170, 235, 205, 0.85)';
      for (const o of deepSky) {
        if (!getScreenPoint(o.pos, labelPos)) continue;
        if (Math.hypot(labelPos.x - cx, labelPos.y - cy) > inside) continue;
        const y = labelPos.y + 16;
        const half = labelCtx.measureText(o.ko).width / 2 + 4;
        const box = [labelPos.x - half, y - 10, labelPos.x + half, y + 10];
        if (placed.some((b) => b[0] < box[2] && box[0] < b[2] && b[1] < box[3] && box[1] < b[3])) continue;
        placed.push(box);
        labelCtx.fillText(o.ko, labelPos.x, y);
      }
    }
    function clearConstellationLabels() {
      labelCtx.setTransform(1, 0, 0, 1, 0, 0);
      labelCtx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
    }

    // ---- 설명 카드 ----
    const infoCard = document.getElementById('infoCard');
    let cardKo = null;   // 설명 카드가 가리키는 별자리 이름(그동안 선을 밝혀 둔다)
    function showInfoCard(title, text, ko) {
      document.getElementById('infoTitle').textContent = title;
      document.getElementById('infoText').textContent = text;
      infoCard.style.display = 'block';
      cardKo = ko || null;
    }
    function hideInfoCard() {
      infoCard.style.display = 'none';
      cardKo = null;
      lightConstellation(shownName ? shownName.ko : null);
    }

    // 누른 곳에서 가장 가까운 이름 있는 밝은 별(STAR_PICK_PX 밖이면 없음)
    function findNamedStarAt(clientX, clientY) {
      let best = null;
      let bestD = STAR_PICK_PX;
      for (const s of BRIGHT_STARS) {
        if (!getScreenPoint(s.pos, labelPos)) continue;
        const d = Math.hypot(labelPos.x - clientX, labelPos.y - clientY);
        if (d < bestD) {
          bestD = d;
          best = s;
        }
      }
      return best;
    }

    // 누른 곳에 있는 성운·은하(화면에 보이는 크기 안이거나 22px 안)
    function findDeepSkyAt(clientX, clientY) {
      let best = null;
      let bestD = Infinity;
      for (const o of deepSky) {
        if (!getScreenPoint(o.pos, labelPos)) continue;
        const d = Math.hypot(labelPos.x - clientX, labelPos.y - clientY);
        const pxRadius = (o.size / 2) / camera.fov * innerHeight;
        if (d <= Math.max(22, pxRadius) && d < bestD) {
          bestD = d;
          best = o;
        }
      }
      return best;
    }

    // ---- 별자리로 날아가기: 가운데로 돌고, 별자리가 둥근 시야에 꽉 차게 확대한다 ----
    const flyDir = new THREE.Vector3();
    function flyToConstellation(c) {
      flyDir.copy(c.center).applyMatrix4(sky.matrixWorld).normalize();
      const fitDiam = c.radius * 2 * 1.35 * 180 / Math.PI;
      flyTo(Math.atan2(flyDir.x, -flyDir.z), Math.asin(flyDir.y), fitDiam);
    }
    // 성운·은하는 크기의 약 4배 시야로 날아가 크게 본다
    function flyToDeepSky(o) {
      flyDir.copy(o.pos).applyMatrix4(sky.matrixWorld).normalize();
      flyTo(Math.atan2(flyDir.x, -flyDir.z), Math.asin(flyDir.y), Math.max(SCOPE_FOVS[SCOPE_FOVS.length - 1], o.size * 4));
    }
    // 정한 방위·고도로 부드럽게 돌고, 둥근 시야 지름(도)을 맞춘다(함께 있는 사람 따라 보기에도 쓴다)
    function flyTo(toAz, toAlt, diam) {
      const alt = Math.max(SCOPE_MIN_ALT, Math.min(SCOPE_MAX_ALT, toAlt));
      const dAz = Math.atan2(Math.sin(toAz - scopeAz), Math.cos(toAz - scopeAz));
      fly = { fromAz: scopeAz, fromAlt: scopeAlt, dAz, toAlt: alt, t0: nowT };
      scopeDiam = Math.max(SCOPE_FOVS[SCOPE_FOVS.length - 1], Math.min(SCOPE_FOVS[0], diam));
      // +/− 버튼이 이어서 동작하도록 가장 가까운 확대 단계를 기억한다
      zoomLevel = SCOPE_FOVS.reduce((best, f, i) => (Math.abs(Math.log(f / scopeDiam)) < Math.abs(Math.log(SCOPE_FOVS[best] / scopeDiam)) ? i : best), 0);
      updateZoomUi();
    }
    function updateFly() {
      if (!fly) return;
      const k = Math.min(1, (nowT - fly.t0) / FLY_TIME);
      const e = k * k * (3 - 2 * k);
      scopeAz = fly.fromAz + fly.dAz * e;
      scopeAlt = fly.fromAlt + (fly.toAlt - fly.fromAlt) * e;
      if (k >= 1) fly = null;
    }

    const scopeTarget = new THREE.Vector3();
    function aimScopeCamera() {
      const cosAlt = Math.cos(scopeAlt);
      scopeTarget.set(Math.sin(scopeAz) * cosAlt, Math.sin(scopeAlt), -Math.cos(scopeAz) * cosAlt).add(SCOPE_EYE);
      camera.position.copy(SCOPE_EYE);
      camera.lookAt(scopeTarget);
    }
    function turnScope(dAz, dAlt) {
      fly = null;   // 손으로 돌리면 날아가기를 멈춘다
      scopeAz += dAz;
      scopeAlt = Math.max(SCOPE_MIN_ALT, Math.min(SCOPE_MAX_ALT, scopeAlt + dAlt));
    }
    // 확대 단계를 바꾼다
    function setZoom(level) {
      zoomLevel = Math.max(0, Math.min(SCOPE_FOVS.length - 1, level));
      scopeDiam = SCOPE_FOVS[zoomLevel];
      updateZoomUi();
    }
    function updateZoomUi() {
      zoomLabel.textContent = scopeDiam >= 80 ? '전체' : '×' + Math.max(1, Math.round(WALK_FOV / scopeDiam));
      document.getElementById('zoomAll').style.visibility = scopeDiam >= 80 ? 'hidden' : 'visible';   // 이미 넓게 볼 때는 숨긴다
      updateStarLook();
    }
    // 망원경은 빛을 더 모으므로 별이 더 밝고 크게 보인다(확대할수록 더). 맨눈 화면은 원래대로
    function updateStarLook() {
      const zoomK = Math.log(SCOPE_FOVS[0] / scopeDiam) / Math.log(SCOPE_FOVS[0] / SCOPE_FOVS[SCOPE_FOVS.length - 1]);
      const gain = scopeOn ? 1 + zoomK : 0;   // 0(맨눈), 1(전체) ~ 2(×30)
      MAG_LAYERS.forEach((l, k) => {
        starLayers[k].material.size = l.size * (1 + 0.45 * gain);
        starLayers[k].material.opacity = Math.min(1, l.opacity + 0.2 * gain);
      });
      // 성운·은하는 넓게 볼 땐 희미하고, 확대할수록 또렷해진다
      for (const o of deepSky) o.sprite.material.opacity = 0.35 + 0.65 * Math.min(1, zoomK * 2);
    }
    // 세로 화면에서도 둥근 시야의 지름이 정한 시야각(도)이 되도록 세로 시야각을 맞춘다
    function getScopeFov(diamDeg) {
      const want = diamDeg * Math.PI / 180;
      const aspect = Math.min(1, camera.aspect);
      return Math.min(MAX_VFOV, 2 * Math.atan(Math.tan(want / 2) / aspect) * 180 / Math.PI);
    }
    function showConstellationLines(show) {
      for (const c of constellations) c.line.visible = show;
    }
    // 지평선: 땅을 숨긴 망원경 화면에서 방향을 잃지 않게 옅은 선으로 둘러 그린다
    const horizonPoints = [];
    for (let i = 0; i < 128; i++) {
      const a = (i / 128) * Math.PI * 2;
      horizonPoints.push(new THREE.Vector3(Math.cos(a) * 88, SCOPE_EYE.y, Math.sin(a) * 88));
    }
    const horizonLine = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(horizonPoints),
      new THREE.LineBasicMaterial({ color: 0x6f9a7a, transparent: true, opacity: 0.55, fog: false })
    );
    horizonLine.visible = false;
    scene.add(horizonLine);
    // 망원경 화면에서는 땅·먼 오름을 숨기고 지평선 선을 보인다
    function showLand(show) {
      ground.visible = show;
      farHills.visible = show;
      horizonLine.visible = !show;
    }
    // 들어갈 때는 망원경이 향한 쪽을 보고, 나올 때는 망원경이 마지막으로 본 쪽을 향하게 둔다
    function enterScope() {
      scopeOn = true;
      scopeAz = telescopeAz;
      scopeAlt = telescopeAlt;
      telescope.visible = false;
      me.visible = false;
      showLand(false);
      fly = null;
      setZoom(0);   // 처음에는 넓게 보며 별자리 이름을 한눈에
      showConstellationLines(true);
      deepSkyGroup.visible = true;
      document.body.classList.add('scope');
      scopeBtn.textContent = '망원경에서 나오기';
      aimScopeCamera();
      updateLinkUi();
    }
    function leaveScope() {
      scopeOn = false;
      drag = null;
      aimTelescope(scopeAz, Math.max(TELESCOPE_MIN_ALT, scopeAlt));
      telescope.visible = true;
      me.visible = true;
      showLand(true);
      fly = null;
      updateStarLook();
      hideConstellationName();
      hideInfoCard();
      clearConstellationLabels();
      showConstellationLines(false);
      deepSkyGroup.visible = false;
      stopMission();
      camera.fov = WALK_FOV;
      camera.updateProjectionMatrix();
      document.body.classList.remove('scope');
      scopeBtn.textContent = '망원경 보기';
      updateLinkUi();
    }
    scopeBtn.addEventListener('click', () => (scopeOn ? leaveScope() : enterScope()));
    document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoomLevel + 1));
    document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoomLevel - 1));
    document.getElementById('zoomAll').addEventListener('click', () => {
      fly = null;
      hideInfoCard();
      setZoom(0);
    });

    // 끌어서 둘러보기: 하늘을 잡아당기는 방향으로 움직인다. 거의 안 움직이고 떼면 누르기로 본다
    function startScopeDrag(e) {
      drag = { x: e.clientX, y: e.clientY, moved: 0 };
    }
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!scopeOn || !drag) return;
      const dx = e.clientX - drag.x;
      const dy = e.clientY - drag.y;
      drag.x = e.clientX;
      drag.y = e.clientY;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      const perPx = camera.fov * Math.PI / 180 / innerHeight;
      turnScope(-dx * perPx, dy * perPx);
    });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!scopeOn || !drag) return;
      const tapped = drag.moved < TAP_PX;
      drag = null;
      if (!tapped) return;
      if (linking) {
        pickStar(e.clientX, e.clientY);
        return;
      }
      // 함께 있는 사람의 동그라미를 누르면 그 사람이 보는 곳으로 따라간다
      const friend = findPeerMarkerAt(e.clientX, e.clientY);
      if (friend) {
        flyTo(friend.az, friend.alt, friend.diam);
        showInfoCard('함께 보는 곳', '같은 방향·같은 배율로 따라왔어요', null);
        return;
      }
      // 밝은 별을 누르면 별 이름, 별자리 선을 누르면 그 별자리로 날아가 크게 보고 설명을 띄운다
      const star = findNamedStarAt(e.clientX, e.clientY);
      if (star) {
        const home = constellations.find((k) => k.id === star.con);
        if (home) showConstellationName(home);
        showInfoCard(star.ko, star.text + (home ? ' · ' + home.ko : ''), home ? home.ko : null);
        if (home) checkMission(home);   // 문제의 별자리에 속한 밝은 별을 눌러도 찾은 것으로 본다
        return;
      }
      const object = findDeepSkyAt(e.clientX, e.clientY);
      if (object) {
        flyToDeepSky(object);
        showInfoCard(object.ko + ' (' + object.code + ')', object.text, null);
        return;
      }
      const c = findConstellationAt(e.clientX, e.clientY);
      if (!c) {
        hideInfoCard();
        return;
      }
      showConstellationName(c);
      flyToConstellation(c);
      showInfoCard(c.ko, CONSTELLATION_INFO[c.id] || '', c.ko);
      checkMission(c);
    });
    renderer.domElement.addEventListener('pointercancel', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => {
      if (!scopeOn) return;
      e.preventDefault();
      setZoom(zoomLevel + (e.deltaY < 0 ? 1 : -1));
    }, { passive: false });

    // 망원경 화면: 방향키로 돌리고, 시야를 확대 단계로 부드럽게 맞춘다
    function updateScope(dt) {
      const turn = KEY_TURN * dt * camera.fov / WALK_FOV;
      if (keys.KeyA || keys.ArrowLeft) turnScope(-turn, 0);
      if (keys.KeyD || keys.ArrowRight) turnScope(turn, 0);
      if (keys.KeyW || keys.ArrowUp) turnScope(0, turn);
      if (keys.KeyS || keys.ArrowDown) turnScope(0, -turn);
      updateFly();
      camera.fov += (getScopeFov(scopeDiam) - camera.fov) * (1 - Math.exp(-(fly ? 3 : 8) * dt));
      camera.updateProjectionMatrix();
      aimScopeCamera();
      camera.updateMatrixWorld();   // 이름표 자리를 이번 장면 기준으로 구하려고
      updateConstellationName();
      drawConstellationLabels();
    }
    // 망원경 가까이 있을 때만 버튼을 보인다
    function updateScopeButton() {
      const show = scopeOn || Math.hypot(me.position.x, me.position.z) < SCOPE_NEAR;
      if (show === scopeBtnShown) return;
      scopeBtnShown = show;
      scopeBtn.style.display = show ? 'block' : 'none';
    }

    // ---------- 소리 (Web Audio, 소리 파일 없음) ----------
    const soundBtn = document.getElementById('soundBtn');
    let audio = null;     // 처음 버튼을 누를 때 만든다
    let soundOn = false;

    function makeNoise(ctx, seconds) {
      const buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    // 밤바람: 잡음에서 낮은 소리만 남기고, 세기와 높이를 천천히 흔든다
    function startWind(ctx, out) {
      const noise = ctx.createBufferSource();
      noise.buffer = makeNoise(ctx, 4);
      noise.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 420;
      lp.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.value = 0.16;
      const swell = ctx.createOscillator();     // 세기: 약 11초에 한 번 커졌다 작아진다
      swell.frequency.value = 0.09;
      const swellDepth = ctx.createGain();
      swellDepth.gain.value = 0.1;
      swell.connect(swellDepth).connect(gain.gain);
      const sweep = ctx.createOscillator();     // 높이: 약 20초에 한 번 오르내린다
      sweep.frequency.value = 0.05;
      const sweepDepth = ctx.createGain();
      sweepDepth.gain.value = 220;
      sweep.connect(sweepDepth).connect(lp.frequency);
      noise.connect(lp).connect(gain).connect(out);
      noise.start();
      swell.start();
      sweep.start();
    }

    // 풀벌레: 높은 음을 빠르게 끊어 "찌르르" 소리를 낸다. 마리마다 높이·박자·자리가 다르다
    const CRICKETS = [
      { freq: 4400, vol: 0.05, pan: -0.6, pulses: 3, gap: 0.42 },
      { freq: 4900, vol: 0.035, pan: 0.5, pulses: 4, gap: 0.55 },
      { freq: 5600, vol: 0.025, pan: 0.1, pulses: 12, gap: 1.6 },   // 길게 우는 먼 벌레
    ];
    const PULSE_STEP = 0.03;   // 한 번 "찌" 하는 간격(초)
    function startCricket(ctx, out, c) {
      const osc = ctx.createOscillator();
      osc.frequency.value = c.freq;
      const env = ctx.createGain();
      env.gain.value = 0;
      const pan = ctx.createStereoPanner();
      pan.pan.value = c.pan;
      osc.connect(env).connect(pan).connect(out);
      osc.start();
      let next = ctx.currentTime + 0.2 + Math.random();
      // 0.5초마다 앞으로 1.5초 안에 울 소리를 미리 적어 둔다(소리를 끄면 시간이 멈춰 더 적지 않는다)
      function scheduleChirps() {
        if (next < ctx.currentTime) next = ctx.currentTime + 0.05;
        while (next < ctx.currentTime + 1.5) {
          if (Math.random() < 0.12) {
            next += 1 + Math.random() * 2;   // 가끔 쉰다
            continue;
          }
          for (let i = 0; i < c.pulses; i++) {
            const t = next + i * PULSE_STEP;
            env.gain.setValueAtTime(0, t);
            env.gain.linearRampToValueAtTime(c.vol, t + 0.004);
            env.gain.linearRampToValueAtTime(0, t + 0.02);
          }
          next += c.pulses * PULSE_STEP + c.gap * (0.85 + Math.random() * 0.3);
        }
        setTimeout(scheduleChirps, 500);
      }
      scheduleChirps();
    }

    // 맑은 종소리: 배음 셋을 겹쳐 울리고 천천히 잦아들게 한다(소리가 꺼져 있으면 울리지 않는다)
    const BELL_BASE = 1046.5;   // 높은 도
    const BELL_PARTIALS = [
      { ratio: 1, vol: 0.22, len: 2.8 },
      { ratio: 2.76, vol: 0.09, len: 1.6 },
      { ratio: 5.4, vol: 0.04, len: 0.8 },
    ];
    function playBell() {
      if (!audio || !soundOn) return;
      const { ctx, master } = audio;
      const now = ctx.currentTime;
      for (const p of BELL_PARTIALS) {
        const osc = ctx.createOscillator();
        osc.frequency.value = BELL_BASE * p.ratio;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(p.vol, now + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, now + p.len);
        osc.connect(g).connect(master);
        osc.start(now);
        osc.stop(now + p.len + 0.05);
      }
    }

    function startAudio() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
      startWind(ctx, master);
      for (const c of CRICKETS) startCricket(ctx, master, c);
      return { ctx, master };
    }

    // 소리 켜기 버튼: 처음에는 무음, 누르면 켜지고 다시 누르면 꺼진다
    soundBtn.addEventListener('click', async () => {
      if (!audio) audio = startAudio();
      soundOn = !soundOn;
      if (soundOn) await audio.ctx.resume();
      else await audio.ctx.suspend();
      soundBtn.textContent = soundOn ? '소리 끄기' : '소리 켜기';
    });

    // ---------- 사진 저장 ----------
    const photoBtn = document.getElementById('photoBtn');
    let wantPhoto = false;    // 다음 장면을 그린 직후에 사진을 만든다
    photoBtn.addEventListener('click', () => { wantPhoto = true; });
    function getPhotoStamp() {
      const d = new Date();
      const two = (n) => String(n).padStart(2, '0');
      return {
        file: d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + '_' + two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds()),
        text: d.getFullYear() + '.' + two(d.getMonth() + 1) + '.' + two(d.getDate()) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()),
      };
    }
    // 방금 그린 화면을 그림 파일로 저장한다. 망원경 화면이면 둥근 시야와 별자리 이름표도 함께 그린다
    function savePhoto() {
      const src = renderer.domElement;
      const out = document.createElement('canvas');
      out.width = src.width;
      out.height = src.height;
      const g = out.getContext('2d');
      g.drawImage(src, 0, 0);
      const w = out.width;
      const h = out.height;
      const px = w / innerWidth;   // 화면 1px이 그림에서 몇 칸인지
      if (scopeOn) {
        g.drawImage(labelCanvas, 0, 0, w, h);   // 별자리 이름들
        const r = Math.min(w, h) / 2;
        const ring = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, r);
        ring.addColorStop(0, 'rgba(0, 0, 0, 0)');
        ring.addColorStop(0.85, 'rgba(0, 0, 0, 0)');
        ring.addColorStop(0.875, 'rgba(150, 170, 230, 0.22)');
        ring.addColorStop(0.91, 'rgba(0, 0, 0, 0.9)');
        ring.addColorStop(1, '#000');
        g.fillStyle = ring;
        g.fillRect(0, 0, w, h);
        if (shownName && conNameEl.style.display === 'block') {
          g.font = '700 ' + 18 * px + 'px sans-serif';
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillStyle = '#fff3c4';
          g.fillText(shownName.ko, parseFloat(conNameEl.style.left) * px, parseFloat(conNameEl.style.top) * px);
        }
      }
      const stamp = getPhotoStamp();
      g.font = 14 * px + 'px sans-serif';
      g.textAlign = 'right';
      g.textBaseline = 'bottom';
      g.fillStyle = 'rgba(207, 214, 255, 0.85)';
      g.fillText('온라인 천문대 · ' + stamp.text, w - 12 * px, h - 10 * px);
      const link = document.createElement('a');
      link.href = out.toDataURL('image/png');
      link.download = '온라인천문대_' + stamp.file + '.png';
      link.click();
    }

    // ---------- 함께 있기 (Trystero 0.22.0, 서버 없음) ----------
    // 동적 import라서 불러오기에 실패해도 혼자 쓰는 화면은 그대로 동작한다
    const APP_ID = 'hoseo-vibe-observatory-aio2o-esg';
    const ROOM = decodeURIComponent(location.hash.slice(1)).trim().slice(0, 40) || 'lobby';   // 주소 끝 #방이름
    const PEER_COLORS = [0x4fc3f7, 0x81c784, 0xba68c8, 0xffd54f, 0xf06292];   // 가족 5명이 겹치지 않는 색
    const SEND_EVERY = 200;      // 내 위치를 보내는 간격(ms)
    const SPARKLE_TIME = 1.6;    // 남이 별자리를 만들면 하늘이 반짝이는 시간(초)
    const MARKER_PICK_PX = 26;   // 누른 곳에서 이 거리(px) 안의 동그라미를 고른다
    const peopleEl = document.getElementById('people');
    const toastEl = document.getElementById('toast');
    const peers = new Map();     // 상대 id → { doll, marker, color, tx, tz, ry, seen, scope, az, alt, diam }
    const spawnPos = me.position.clone();
    let sendPos = null;
    let sendLink = null;
    let sparkleStart = -1;
    let toastUntil = 0;

    // 휴대폰에서도 양옆 버튼과 겹치지 않게 짧게 쓴다(긴 방이름은 10자에서 줄임)
    function showPeople() {
      const name = ROOM.length > 10 ? ROOM.slice(0, 10) + '…' : ROOM;
      const room = ROOM === 'lobby' ? '' : '#' + name + ' · ';
      const watching = [...peers.values()].filter((p) => p.seen && p.scope).length;
      peopleEl.textContent = peers.size === 0
        ? room + '혼자 보는 중'
        : room + '함께 ' + (peers.size + 1) + '명' + (watching ? ' · 망원경 ' + watching + '명' : '');
    }
    showPeople();
    function showToast(text) {
      toastEl.textContent = text;
      toastEl.style.display = 'block';
      toastUntil = nowT + 3;
    }
    // 아직 아무도 안 쓴 색을 고른다(5명까지 겹치지 않게)
    function pickPeerColor() {
      const used = new Set([...peers.values()].map((p) => p.color));
      return PEER_COLORS.find((c) => !used.has(c)) ?? PEER_COLORS[peers.size % PEER_COLORS.length];
    }
    // 망원경 화면에서 보이는 동그라미(그 사람이 보는 곳)
    function makeRingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 128;
      const g = canvas.getContext('2d');
      g.strokeStyle = '#ffffff';
      g.lineWidth = 9;
      g.beginPath();
      g.arc(64, 64, 52, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      g.arc(64, 64, 6, 0, Math.PI * 2);
      g.fillStyle = '#ffffff';
      g.fill();
      return new THREE.CanvasTexture(canvas);
    }
    const ringTex = makeRingTexture();
    function addPeer(id) {
      if (peers.has(id)) return peers.get(id);
      const color = pickPeerColor();
      const doll = makeDoll(color);
      doll.visible = false;   // 첫 위치를 받기 전에는 숨긴다
      scene.add(doll);
      const marker = new THREE.Sprite(new THREE.SpriteMaterial({ map: ringTex, color, transparent: true, depthTest: false, fog: false }));
      marker.visible = false;
      scene.add(marker);
      const p = { doll, marker, color, tx: 0, tz: 0, ry: 0, seen: false, scope: false, az: 0, alt: 0, diam: SCOPE_FOVS[0] };
      peers.set(id, p);
      showPeople();
      return p;
    }
    function removePeer(id) {
      const p = peers.get(id);
      if (!p) return;
      scene.remove(p.doll);
      scene.remove(p.marker);
      p.marker.material.dispose();
      peers.delete(id);
      showPeople();
    }
    // 처음 자리가 다른 사람과 겹치면 망원경 둘레 다른 곳으로 비켜 선다(아직 걷지 않았을 때만)
    function moveToFreeSpawn() {
      const a = Math.random() * Math.PI * 2;
      me.position.set(Math.sin(a) * 5, 0, Math.cos(a) * 5);
      me.rotation.y = a + Math.PI;   // 망원경 쪽을 본다
      camYaw = a;
      camYawTarget = a;
      camera.position.set(me.position.x + Math.sin(a) * CAM_BACK, CAM_UP, me.position.z + Math.cos(a) * CAM_BACK);
      spawnPos.copy(me.position);
    }
    const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
    function sendMyState() {
      if (!sendPos) return;
      sendPos({
        x: +me.position.x.toFixed(2), z: +me.position.z.toFixed(2), r: +me.rotation.y.toFixed(2),
        s: scopeOn ? 1 : 0, a: +scopeAz.toFixed(3), l: +scopeAlt.toFixed(3), d: +scopeDiam.toFixed(1),
      });
    }
    function sendLinkSignal() {
      if (sendLink) sendLink(1);
    }
    async function joinFamilyRoom() {
      try {
        const { joinRoom } = await import('https://cdn.jsdelivr.net/npm/trystero@0.22.0/+esm');
        const room = joinRoom({ appId: APP_ID }, ROOM);
        const [sp, getPos] = room.makeAction('pos');
        const [sl, getLink] = room.makeAction('link');
        sendPos = sp;
        sendLink = sl;
        room.onPeerJoin((id) => {
          addPeer(id);
          sendMyState();
        });
        room.onPeerLeave((id) => removePeer(id));
        getPos((d, id) => {
          if (!d || !isNum(d.x) || !isNum(d.z) || !isNum(d.r)) return;
          const p = addPeer(id);
          p.tx = d.x;
          p.tz = d.z;
          p.ry = d.r;
          const wasScope = p.scope;
          p.scope = d.s === 1 && isNum(d.a) && isNum(d.l) && isNum(d.d);
          if (p.scope) {
            p.az = d.a;
            p.alt = d.l;
            p.diam = d.d;
          }
          if (!p.seen) {
            p.seen = true;
            p.doll.position.set(d.x, 0, d.z);
            p.doll.rotation.y = d.r;
            const stillAtSpawn = me.position.distanceTo(spawnPos) < 0.01;
            if (stillAtSpawn && Math.hypot(d.x - me.position.x, d.z - me.position.z) < 1.5) moveToFreeSpawn();
          }
          if (wasScope !== p.scope) showPeople();
        });
        getLink(() => {
          sparkleStart = nowT;
          showToast('함께 있는 사람이 별자리를 만들었어요');
        });
        setInterval(sendMyState, SEND_EVERY);
      } catch (e) {
        console.warn('함께 있기를 켜지 못했습니다. 혼자 보는 화면으로 계속합니다.', e);
        peopleEl.textContent = '혼자 보는 중(함께 있기 연결 안 됨)';
      }
    }
    // 망원경 화면에서 누른 곳 가까이의 동그라미(그 사람이 보는 곳)를 찾는다
    const markerScreen = new THREE.Vector3();
    function findPeerMarkerAt(clientX, clientY) {
      let best = null;
      let bestD = MARKER_PICK_PX;
      for (const p of peers.values()) {
        if (!p.marker.visible) continue;
        markerScreen.copy(p.marker.position).project(camera);
        if (markerScreen.z > 1) continue;
        const d = Math.hypot((markerScreen.x + 1) / 2 * innerWidth - clientX, (1 - markerScreen.y) / 2 * innerHeight - clientY);
        if (d < bestD) {
          bestD = d;
          best = p;
        }
      }
      return best;
    }
    // 다른 사람 인형은 부드럽게 따라가고(망원경 화면에선 숨김), 망원경을 보는 사람은 보는 곳에 동그라미를 둔다
    function updatePeers(dt) {
      const ease = 1 - Math.exp(-10 * dt);
      const markerSize = 80 * Math.tan(camera.fov * Math.PI / 360) * 0.14;
      for (const p of peers.values()) {
        p.doll.visible = p.seen && !scopeOn;
        if (!p.seen) continue;
        p.doll.position.x += (p.tx - p.doll.position.x) * ease;
        p.doll.position.z += (p.tz - p.doll.position.z) * ease;
        const turn = Math.atan2(Math.sin(p.ry - p.doll.rotation.y), Math.cos(p.ry - p.doll.rotation.y));
        p.doll.rotation.y += turn * ease;
        p.marker.visible = scopeOn && p.scope;
        if (p.marker.visible) {
          const cosAlt = Math.cos(p.alt);
          p.marker.position.set(Math.sin(p.az) * cosAlt, Math.sin(p.alt), -Math.cos(p.az) * cosAlt).multiplyScalar(80).add(SCOPE_EYE);
          p.marker.scale.set(markerSize, markerSize, 1);
        }
      }
      if (toastUntil && nowT > toastUntil) {
        toastUntil = 0;
        toastEl.style.display = 'none';
      }
    }
    // 남이 별자리를 만들면 밝은 별들이 잠깐 커졌다 작아지며 반짝인다
    function updateSparkle(t) {
      if (sparkleStart < 0) return;
      const k = (t - sparkleStart) / SPARKLE_TIME;
      updateStarLook();
      if (k >= 1 || k < 0) {
        sparkleStart = -1;
        return;
      }
      const pulse = 1 + 0.9 * Math.sin(k * Math.PI) * (0.65 + 0.35 * Math.sin(t * 25));
      for (let i = 0; i < 4; i++) {
        starLayers[i].material.size *= pulse;
        starLayers[i].material.opacity = 1;
      }
    }
    joinFamilyRoom();

    // ---------- 별자리 찾기 미션 ----------
    const missionBtn = document.getElementById('missionBtn');
    const DIRECTIONS = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
    const MISSION_MIN_ALT = 15;   // 이 고도(도) 위에 떠 있는 별자리에서 문제를 낸다
    let mission = null;           // 지금 문제 { ko, text }
    const missionDir = new THREE.Vector3();
    // 별자리 가운데가 지금 어느 방위·고도(도)에 있는지
    function getSkyPlace(c) {
      missionDir.copy(c.center).applyMatrix4(sky.matrixWorld).normalize();
      let az = Math.atan2(missionDir.x, -missionDir.z) * 180 / Math.PI;
      if (az < 0) az += 360;
      return { az, alt: Math.asin(missionDir.y) * 180 / Math.PI };
    }
    // 설명이 있는 잘 알려진 별자리 중 지금 떠 있는 것을 골라, 방위·높이 힌트와 함께 문제를 낸다
    function pickMission() {
      const known = constellations.filter((c) => CONSTELLATION_INFO[c.id] && (!mission || c.ko !== mission.ko));
      const up = known.filter((c) => getSkyPlace(c).alt >= MISSION_MIN_ALT);
      const pool = up.length ? up : known;
      const c = pool[Math.floor(Math.random() * pool.length)];
      const { az, alt } = getSkyPlace(c);
      const height = alt < 0 ? '지평선 아래' : alt < 25 ? '낮게' : alt < 55 ? '중간 높이' : '높이';
      mission = { ko: c.ko, text: '찾아 보세요: ' + c.ko + ' · ' + DIRECTIONS[Math.round(az / 45) % 8] + '쪽 하늘 ' + height };
      updateLinkUi();
    }
    function stopMission() {
      mission = null;
      missionBtn.textContent = '별자리 찾기';
      updateLinkUi();
    }
    missionBtn.addEventListener('click', () => {
      if (mission) {
        stopMission();
        return;
      }
      missionBtn.textContent = '찾기 그만';
      pickMission();
    });
    // 문제의 별자리를 누르면 종소리·반짝임과 함께 도장을 찍고 다음 문제를 낸다
    function checkMission(c) {
      if (!mission || c.ko !== mission.ko) return;
      foundCount += 1;
      saveTodayCount(foundCount, 'found');
      showCount();
      playBell();
      sparkleStart = nowT;
      showToast('찾았어요! 오늘 찾은 별자리 ' + foundCount + '개');
      pickMission();
    }

    // ---------- 하늘 시각 (빨리 감기 · 지금 하늘) ----------
    const START_MS = Date.UTC(2026, 10, 25, 12, 0, 0);   // 2026년 11월 25일 밤 9시(한국 시각)
    const J2000_MS = Date.UTC(2000, 0, 1, 12, 0, 0);
    const TIME_SPEEDS = [1, 60, 600];                     // 실제 속도, 1초에 1분, 1초에 10분
    const SPEED_LABELS = ['▶ 실제 속도', '▶▶ 1초=1분', '▶▶▶ 1초=10분'];
    const skyClockEl = document.getElementById('skyClock');
    const speedBtn = document.getElementById('speedBtn');
    const nowBtn = document.getElementById('nowBtn');
    let skyBaseMs = START_MS;   // 하늘 시각의 출발점
    let skySimSec = 0;          // 출발점에서 흐른 하늘 시각(초)
    let timeSpeedIndex = 0;
    let showingNow = false;     // 지금 하늘을 보는 중인지
    let clockText = '';
    // 그 시각 제주의 지방 항성시(도, 0~360)
    function getLstDeg(ms) {
      const days = (ms - J2000_MS) / 86400000;
      const deg = 280.46061837 + 360.98564736629 * days + OBS_LON_DEG;
      return ((deg % 360) + 360) % 360;
    }
    // 별을 놓아 둔 시각(START_LST)에서 하늘 시각까지 하늘이 돈 각도
    function getSkyAngle() {
      return getLstDeg(skyBaseMs + skySimSec * 1000) * Math.PI / 180 - START_LST;
    }
    function showSkyClock() {
      const d = new Date(skyBaseMs + skySimSec * 1000);
      const two = (n) => String(n).padStart(2, '0');
      const text = '하늘 ' + (d.getMonth() + 1) + '.' + d.getDate() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
      if (text === clockText) return;
      clockText = text;
      skyClockEl.textContent = text;
    }
    function updateSkyTime(dt) {
      skySimSec += dt * TIME_SPEEDS[timeSpeedIndex];
      showSkyClock();
    }
    speedBtn.addEventListener('click', () => {
      timeSpeedIndex = (timeSpeedIndex + 1) % TIME_SPEEDS.length;
      speedBtn.textContent = SPEED_LABELS[timeSpeedIndex];
    });
    // 지금 하늘(지금 이 순간 제주 하늘)과 11월 25일 밤 9시 하늘을 오간다
    nowBtn.addEventListener('click', () => {
      showingNow = !showingNow;
      skyBaseMs = showingNow ? Date.now() : START_MS;
      skySimSec = 0;
      nowBtn.textContent = showingNow ? '11월 25일 밤' : '지금 하늘';
      showSkyClock();
    });

    // ---------- 반복 ----------
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.elapsedTime;
      if (scopeOn) {
        updateScope(dt);
      } else {
        updateMe(dt);
        updateCamera(dt);
      }
      updateScopeButton();
      updateSkyTime(dt);
      updateStars(t);
      updateLinks(t);
      updatePeers(dt);
      updateSparkle(t);
      renderer.render(scene, camera);
      if (wantPhoto) {
        wantPhoto = false;
        savePhoto();   // 그린 직후라야 화면 그림이 비어 있지 않다
      }
      requestAnimationFrame(animate);
    }
    camera.position.set(0, CAM_UP, 5 + CAM_BACK);
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
