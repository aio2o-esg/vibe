<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 천문대</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; touch-action: none; }
    canvas { display: block; }
    #hint { position: fixed; left: 0; right: 0; top: 10px; text-align: center; color: #cfd6ff; font: 14px sans-serif; opacity: 0.8; pointer-events: none; }
    #count { position: fixed; left: 0; right: 0; top: 34px; text-align: center; color: #ffd98a; font: 16px sans-serif; pointer-events: none; }
    #linkBtn { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 14px 28px; font: 18px sans-serif; color: #2a1d05; background: #ffcc44; border: 0; border-radius: 28px; cursor: pointer; }
    #linkBtn.on { color: #ffe9a8; background: rgba(40, 32, 10, 0.85); border: 1px solid #ffcc44; }
    #soundBtn { position: fixed; right: 12px; top: 62px; padding: 8px 14px; font: 14px sans-serif; color: #cfd6ff; background: rgba(30, 36, 80, 0.8); border: 1px solid #5560a8; border-radius: 18px; cursor: pointer; }
    #eyepiece { position: fixed; inset: 0; display: none; pointer-events: none; background: radial-gradient(circle closest-side, transparent 85%, rgba(150, 170, 230, 0.22) 87.5%, rgba(0, 0, 0, 0.9) 91%, #000 100%); }
    #scopeBtn { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); display: none; padding: 10px 22px; font: 16px sans-serif; color: #dfe6ff; background: rgba(30, 36, 80, 0.85); border: 1px solid #7f8fe0; border-radius: 22px; cursor: pointer; white-space: nowrap; }
    #zoomBox { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; align-items: center; gap: 8px; color: #dfe6ff; font: 15px sans-serif; }
    #zoomBox button { width: 44px; height: 44px; border-radius: 22px; font: 22px sans-serif; color: #dfe6ff; background: rgba(30, 36, 80, 0.85); border: 1px solid #7f8fe0; cursor: pointer; }
    #conName { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%); display: none; padding: 6px 14px; font: 18px sans-serif; color: #fff3c4; background: rgba(10, 14, 40, 0.75); border: 1px solid rgba(191, 208, 255, 0.6); border-radius: 16px; pointer-events: none; white-space: nowrap; }
    body.scope #eyepiece { display: block; }
    body.scope #zoomBox { display: flex; }
  </style>
</head>
<body>
  <div id="eyepiece"></div>
  <div id="conName"></div>
  <div id="hint">바닥을 누르거나 WASD · 방향키로 걷기</div>
  <div id="count">오늘 만든 별자리 0개</div>
  <button id="linkBtn" type="button">별자리 잇기</button>
  <button id="soundBtn" type="button">소리 켜기</button>
  <button id="scopeBtn" type="button">망원경 보기</button>
  <div id="zoomBox">
    <button id="zoomIn" type="button" aria-label="확대">+</button>
    <span id="zoomLabel">×2</span>
    <button id="zoomOut" type="button" aria-label="축소">−</button>
  </div>
  <script src="sky-data.js"></script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // 고정 난수: 새로고침해도, 누가 열어도 별과 먼 오름 자리가 같다
    let seed = 20261110;
    function makeRandom() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    // ---------- 장면 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070a1c);
    scene.fog = new THREE.Fog(0x070a1c, 25, 70);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x333a66, 0.8));
    const moon = new THREE.DirectionalLight(0x8899ff, 0.25);
    moon.position.set(-10, 20, 5);
    scene.add(moon);

    // 별빛: 하늘 쪽은 푸르스름하게, 땅 쪽은 어둡게 비춘다
    scene.add(new THREE.HemisphereLight(0x5566aa, 0x1a2418, 2.2));

    // 오름: 걸어 다니는 꼭대기는 평평하고, 그 바깥은 완만하게 내려간다
    const TOP_R = 37;       // 평평한 꼭대기 반지름(걷는 끝 35보다 조금 넓게)
    const HILL_R = 90;      // 오름 자락 끝
    const HILL_DROP = 16;   // 꼭대기에서 자락 끝까지 내려가는 높이
    function getHillHeight(r) {
      if (r <= TOP_R) return 0;
      const k = Math.min(1, (r - TOP_R) / (HILL_R - TOP_R));
      return -HILL_DROP * k * k * (3 - 2 * k);
    }
    const hillGeo = new THREE.RingGeometry(0, HILL_R, 96, 48);
    const hillPos = hillGeo.attributes.position;
    for (let i = 0; i < hillPos.count; i++) {
      hillPos.setZ(i, getHillHeight(Math.hypot(hillPos.getX(i), hillPos.getY(i))));
    }
    hillGeo.computeVertexNormals();
    const ground = new THREE.Mesh(
      hillGeo,
      new THREE.MeshStandardMaterial({ color: 0x1d2a1a, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 멀리 보이는 다른 오름들: 지평선의 별을 가리는 검은 능선
    const farHillGeo = new THREE.SphereGeometry(1, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    const farHillMat = new THREE.MeshBasicMaterial({ color: 0x03050b, fog: false });
    const farHills = new THREE.Group();   // 망원경 화면에서 한꺼번에 숨기려고 묶어 둔다
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + makeRandom() * 0.3;
      const farHill = new THREE.Mesh(farHillGeo, farHillMat);
      farHill.scale.set(18 + makeRandom() * 14, 14 + makeRandom() * 12, 8);
      farHill.position.set(Math.cos(a) * 84, -HILL_DROP, Math.sin(a) * 84);
      farHill.rotation.y = Math.PI / 2 - a;
      farHills.add(farHill);
    }
    scene.add(farHills);

    // 글씨 무늬: [글자, 색] 조각을 가운데 맞춰 이어 쓴 투명 바탕 그림(코드로 그린다)
    function makeTextTexture(parts, width, height, font) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const g = canvas.getContext('2d');
      g.font = font;
      g.textBaseline = 'middle';
      const total = parts.reduce((w, [text]) => w + g.measureText(text).width, 0);
      let x = (width - total) / 2;
      for (const [text, color] of parts) {
        g.fillStyle = color;
        g.fillText(text, x, height / 2);
        x += g.measureText(text).width;
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    // 망원경: VESPERA II처럼 흰 둥근 몸통 옆에 경통이 붙은 스마트 망원경, 짧은 검은 삼발이
    const telescope = new THREE.Group();
    const vespera = new THREE.Group();
    const shellMat = new THREE.MeshStandardMaterial({ color: 0xf2f4f7, metalness: 0.05, roughness: 0.35 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x14161b, metalness: 0.3, roughness: 0.3 });
    const VESPERA_SIZE = 0.8;   // 망원경 전체 크기
    const HUB_Y = 0.4;          // 삼발이 위 받침 높이
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2 + Math.PI / 6;
      const top = new THREE.Vector3(0, HUB_Y, 0);
      const foot = new THREE.Vector3(Math.cos(a) * 0.5, 0, Math.sin(a) * 0.5);
      const dir = top.clone().sub(foot);
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, dir.length(), 8), blackMat);
      leg.position.copy(foot).add(top).multiplyScalar(0.5);
      leg.quaternion.setFromUnitVectors(up, dir.normalize());
      vespera.add(leg);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.08, 16), blackMat);
    hub.position.y = HUB_Y;
    vespera.add(hub);

    // 방위로 도는 부분: 둥근 기둥 몸통, 아래로 휜 발, 파란 링 불빛, 몸통 글씨, 옆에 붙은 경통
    const scopeTurn = new THREE.Group();
    const column = new THREE.Mesh(new THREE.CapsuleGeometry(0.26, 1.0, 8, 24), shellMat);
    column.position.y = HUB_Y + 0.76;
    column.scale.z = 0.7;
    scopeTurn.add(column);
    const bodyFoot = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.24, 8, 16), shellMat);
    bodyFoot.rotation.z = Math.PI / 2;
    bodyFoot.position.set(0.2, HUB_Y + 0.22, 0);
    bodyFoot.scale.z = 0.7;
    scopeTurn.add(bodyFoot);
    const ledRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.075, 0.012, 8, 32),
      new THREE.MeshBasicMaterial({ color: 0x5cc8ff })
    );
    ledRing.position.set(-0.262, HUB_Y + 1.2, 0);
    ledRing.rotation.y = Math.PI / 2;
    scopeTurn.add(ledRing);
    const nameTex = makeTextTexture([['VESPERA II', '#6f7890']], 1024, 172, '600 124px "Segoe UI", "Helvetica Neue", Arial, sans-serif');
    const nameLabel = new THREE.Mesh(
      new THREE.PlaneGeometry(0.95, 0.16),
      new THREE.MeshStandardMaterial({
        map: nameTex, transparent: true, depthWrite: false,
        emissive: 0xffffff, emissiveMap: nameTex, emissiveIntensity: 0.3,
      })
    );
    nameLabel.position.set(-0.264, HUB_Y + 0.7, 0);
    nameLabel.rotation.set(0, -Math.PI / 2, Math.PI / 2);   // 몸통 옆면에 세로로 쓴다
    scopeTurn.add(nameLabel);
    const joint = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.1, 20), shellMat);
    joint.rotation.z = Math.PI / 2;
    joint.position.set(0.31, HUB_Y + 1.22, 0);
    scopeTurn.add(joint);

    // 경통: 뒤쪽은 흰 둥근 통, 앞쪽은 검은 통, 끝에 렌즈. 옆 축을 중심으로 고도만큼 들린다
    const tubePivot = new THREE.Group();
    tubePivot.position.set(0.47, HUB_Y + 1.22, 0);
    const tubeBack = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.45, 8, 24), shellMat);
    tubeBack.position.y = -0.1;
    tubePivot.add(tubeBack);
    const tubeFront = new THREE.Mesh(new THREE.CylinderGeometry(0.178, 0.178, 0.55, 24), blackMat);
    tubeFront.position.y = 0.42;
    tubePivot.add(tubeFront);
    const lens = new THREE.Mesh(
      new THREE.CircleGeometry(0.14, 24),
      new THREE.MeshBasicMaterial({ color: 0x2a3d70 })
    );
    lens.rotation.x = -Math.PI / 2;
    lens.position.y = 0.70;
    tubePivot.add(lens);
    scopeTurn.add(tubePivot);
    vespera.add(scopeTurn);
    vespera.scale.setScalar(VESPERA_SIZE);
    telescope.add(vespera);

    // 망원경이 향한 방위(북 0, 동쪽으로 +)와 고도. 처음에는 북서쪽 하늘 45도(고니자리 쪽)를 본다
    let telescopeAz = 0;
    let telescopeAlt = 0;
    function aimTelescope(az, alt) {
      telescopeAz = az;
      telescopeAlt = alt;
      scopeTurn.rotation.y = -az;
      tubePivot.rotation.x = -(Math.PI / 2 - alt);
    }
    aimTelescope(297 * Math.PI / 180, Math.PI / 4);

    const basaltGeo = new THREE.DodecahedronGeometry(0.22);
    const basaltMat = new THREE.MeshStandardMaterial({ color: 0x2c2f36, roughness: 1 });
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const stone = new THREE.Mesh(basaltGeo, basaltMat);
      stone.position.set(Math.cos(a) * 1.45, 0.06, Math.sin(a) * 1.45);
      stone.scale.y = 0.45;
      telescope.add(stone);
    }

    // 관측할 때 쓰는 작은 붉은 등: 눈부시지 않게 받침 주변만 비춘다
    const redLamp = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 12, 8),
      new THREE.MeshBasicMaterial({ color: 0xff4a3a })
    );
    redLamp.position.set(0.8, 0.1, 0.6);
    telescope.add(redLamp);
    const redLight = new THREE.PointLight(0xff4433, 4, 7, 2);
    redLight.position.set(0.8, 0.4, 0.6);
    telescope.add(redLight);
    scene.add(telescope);

    // 별: 코드로 그린 둥근 빛 무늬로 별마다 빛이 번지게 한다
    function makeGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      const g = canvas.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.18, 'rgba(255,255,255,0.85)');
      grad.addColorStop(0.45, 'rgba(255,255,255,0.15)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const glowTex = makeGlowTexture();
    const STAR_R = 90;
    const sky = new THREE.Group();

    // 관측 자리와 시각: 2026년 11월 25일 밤 9시(한국 시각), 제주(북위 33.4도, 동경 126.5도)
    const OBS_LAT = 33.4 * Math.PI / 180;
    const START_LST = 11.1 * Math.PI / 180;      // 그 시각의 지방 항성시(약 0시 44분)
    const SIDEREAL_RATE = 2 * Math.PI / 86164;   // 하늘이 1초에 도는 각도(실제 속도)
    // 하늘의 북극 방향: 북쪽(-z)에서 위도만큼 들려 있다. 하늘은 이 축을 중심으로 돈다
    const POLE_AXIS = new THREE.Vector3(0, Math.sin(OBS_LAT), -Math.cos(OBS_LAT));

    // 적경·적위(도)를 시작 시각의 하늘 방향으로 바꾼다. 동쪽 +x, 위 +y, 북쪽 -z
    function getSkyDir(raDeg, decDeg) {
      const dec = decDeg * Math.PI / 180;
      const hourAngle = START_LST - raDeg * Math.PI / 180;
      const toMeridian = Math.cos(dec) * Math.cos(hourAngle);
      const toEast = -Math.cos(dec) * Math.sin(hourAngle);
      const toPole = Math.sin(dec);
      const north = -toMeridian * Math.sin(OBS_LAT) + toPole * Math.cos(OBS_LAT);
      const up = toMeridian * Math.cos(OBS_LAT) + toPole * Math.sin(OBS_LAT);
      return new THREE.Vector3(toEast, up, -north);
    }

    // B-V 색지수로 별빛 색을 정한다(파란 별 ~ 붉은 별)
    const BV_COLORS = [[-0.3, 0x9bb0ff], [0, 0xcad7ff], [0.3, 0xf8f7ff], [0.6, 0xfff4e8], [1.0, 0xffd2a1], [1.5, 0xffb46b], [2.0, 0xff9a50]];
    const colorA = new THREE.Color();
    const colorB = new THREE.Color();
    function getStarColor(bv, out) {
      const k = BV_COLORS.findIndex(([v]) => bv < v);
      if (k <= 0) return out.setHex(BV_COLORS[k === 0 ? 0 : BV_COLORS.length - 1][1]);
      const [v0, c0] = BV_COLORS[k - 1];
      const [v1, c1] = BV_COLORS[k];
      return out.lerpColors(colorA.setHex(c0), colorB.setHex(c1), (bv - v0) / (v1 - v0));
    }

    // 자리·색 배열로 빛나는 점 묶음을 만들어 하늘에 붙인다
    function makePoints(pos, col, size, opacity) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      const points = new THREE.Points(geo, new THREE.PointsMaterial({
        size, map: glowTex, vertexColors: true, transparent: true, opacity,
        depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      }));
      sky.add(points);
      return points;
    }

    // 실제 별(6등급까지): 등급 묶음마다 크기와 밝기를 달리한다
    const MAG_LAYERS = [
      { maxMag: 1.5, size: 4.2, opacity: 1 },
      { maxMag: 2.5, size: 3.2, opacity: 1 },
      { maxMag: 3.5, size: 2.4, opacity: 0.95 },
      { maxMag: 4.5, size: 1.7, opacity: 0.85 },
      { maxMag: 5.2, size: 1.3, opacity: 0.8 },
      { maxMag: 99, size: 1.0, opacity: 0.65 },
    ];
    const PICK_MAX_MAG = 4;     // 별자리 잇기로 고를 수 있는 가장 어두운 등급
    const pickableStars = [];   // 고를 수 있는 별(하늘 묶음 기준 자리)
    const layerPos = MAG_LAYERS.map(() => []);
    const layerCol = MAG_LAYERS.map(() => []);
    const starColor = new THREE.Color();
    const starData = window.SKY_DATA.stars;
    for (let i = 0; i < starData.length; i += 4) {
      const mag = starData[i + 2];
      const pos = getSkyDir(starData[i], starData[i + 1]).multiplyScalar(STAR_R);
      const k = MAG_LAYERS.findIndex((l) => mag <= l.maxMag);
      layerPos[k].push(pos.x, pos.y, pos.z);
      getStarColor(starData[i + 3], starColor);
      layerCol[k].push(starColor.r, starColor.g, starColor.b);
      if (mag <= PICK_MAX_MAG) pickableStars.push(pos);
    }
    const starLayers = MAG_LAYERS.map((l, k) => makePoints(layerPos[k], layerCol[k], l.size, l.opacity));

    // 은하수: 실제 은하면(은하 북극 적경 192.86도, 적위 27.13도)을 따라 흐린 빛과 작은 별을 뿌린다
    const bandNormal = getSkyDir(192.86, 27.13);
    const bandU = new THREE.Vector3(1, 0, 0).cross(bandNormal).normalize();
    const bandV = bandNormal.clone().cross(bandU);
    function pickBandDir(spread) {
      const a = makeRandom() * Math.PI * 2;
      const off = (makeRandom() + makeRandom() + makeRandom() - 1.5) * spread;
      return bandU.clone().multiplyScalar(Math.cos(a))
        .addScaledVector(bandV, Math.sin(a))
        .addScaledVector(bandNormal, off)
        .normalize();
    }
    function makeBandLayer(count, size, opacity, spread, colors) {
      const pos = [];
      const col = [];
      const c = new THREE.Color();
      for (let i = 0; i < count; i++) {
        const d = pickBandDir(spread);
        pos.push(d.x * STAR_R, d.y * STAR_R, d.z * STAR_R);
        c.setHex(colors[Math.floor(makeRandom() * colors.length)]);
        col.push(c.r, c.g, c.b);
      }
      makePoints(pos, col, size, opacity);
    }
    makeBandLayer(800, 9, 0.05, 0.18, [0x9fb4ff, 0xc8d4ff, 0xe8e0ff]);   // 은하수의 뿌연 빛
    makeBandLayer(4500, 0.6, 0.4, 0.12, [0xdfe8ff, 0xffffff, 0xfff2d6]); // 은하수의 작은 별
    scene.add(sky);

    // 하늘은 북극 축을 중심으로 실제 속도로 돌고, 밝은 별은 서로 다른 박자로 반짝인다
    function updateStars(t) {
      sky.quaternion.setFromAxisAngle(POLE_AXIS, -SIDEREAL_RATE * t);
      starLayers[0].material.opacity = 0.88 + Math.sin(t * 2.6 + 1) * 0.12;
      starLayers[1].material.opacity = 0.86 + Math.sin(t * 1.7) * 0.12;
    }

    // ---------- 인형 ----------
    const shirtPrintTex = makeTextTexture(
      [['MARUS', '#111111'], ['Y', '#22aee6'], ['S', '#111111'], [' edu', '#22aee6']],
      1024, 236, '600 150px "Segoe UI", "Helvetica Neue", Arial, sans-serif'
    );
    function makeDoll(color) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 20, 16),
        new THREE.MeshStandardMaterial({ color })
      );
      body.position.y = 0.5;
      body.scale.y = 1.15;
      g.add(body);
      // 눈사람 아랫부분 등쪽(-z)에 옷 무늬처럼 MARUSYS edu 글씨를 두른다(몸에 붙여 같이 늘어나고 돈다)
      const shirtPrint = new THREE.Mesh(
        new THREE.SphereGeometry(0.455, 40, 8, Math.PI * 1.5 - 1.2, 2.4, Math.PI / 2 - 0.24, 0.48),
        new THREE.MeshStandardMaterial({
          map: shirtPrintTex, transparent: true, depthWrite: false,
          emissive: 0xffffff, emissiveMap: shirtPrintTex, emissiveIntensity: 0.45,   // 어두운 밤에도 글씨가 보이게 살짝 빛낸다
        })
      );
      body.add(shirtPrint);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 20, 16),
        new THREE.MeshStandardMaterial({ color: 0xffd9b8 })
      );
      head.position.y = 1.25;
      g.add(head);
      return g;
    }
    const me = makeDoll(0xe8643c);
    me.position.set(0, 0, 5);
    scene.add(me);

    // ---------- 걷기 ----------
    const SPEED = 2;      // 1초에 걷는 거리(천천히)
    const CLICK_STEP = 8; // 한 번 눌러서 걷는 가장 먼 거리
    const WALK_R = 35;    // 걸을 수 있는 바깥 끝
    const FIRE_R = 1.7;   // 모닥불 돌 둘레, 이 안으로는 못 들어간다
    const MOVE_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowLeft', 'ArrowDown', 'ArrowRight'];
    const keys = {};
    let target = null;    // 바닥을 눌러 정한 목적지

    addEventListener('keydown', (e) => {
      if (!MOVE_KEYS.includes(e.code)) return;
      keys[e.code] = true;
      target = null;
    });
    addEventListener('keyup', (e) => { keys[e.code] = false; });
    // 창을 벗어나면 누르고 있던 키를 모두 뗀 것으로 본다
    addEventListener('blur', () => { for (const k of MOVE_KEYS) keys[k] = false; });

    // 자리를 걸을 수 있는 곳(불 바깥, 캠핑장 안)으로 옮긴다
    function keepInWalkArea(pos) {
      const r = Math.hypot(pos.x, pos.z);
      if (r > WALK_R) {
        pos.x *= WALK_R / r;
        pos.z *= WALK_R / r;
      } else if (r < 0.001) {
        pos.x = 0;
        pos.z = FIRE_R;
      } else if (r < FIRE_R) {
        pos.x *= FIRE_R / r;
        pos.z *= FIRE_R / r;
      }
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function pickGround(clientX, clientY) {
      pointer.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(ground)[0];
      if (hit) {
        target = hit.point.clone();
      } else {
        // 하늘처럼 바닥이 아닌 곳을 누르면 그 방향으로 걷는다(거리는 아래에서 CLICK_STEP으로 줄인다)
        const dir = raycaster.ray.direction;
        const len = Math.hypot(dir.x, dir.z);
        if (len < 0.001) return;
        const dx = dir.x / len, dz = dir.z / len;
        const b = me.position.x * dx + me.position.z * dz;
        const c = me.position.x * me.position.x + me.position.z * me.position.z - WALK_R * WALK_R;
        const far = -b + Math.sqrt(Math.max(0, b * b - c));
        target = new THREE.Vector3(me.position.x + dx * far, 0, me.position.z + dz * far);
      }
      // 한 번 누르면 그 방향으로 CLICK_STEP까지만 걷는다
      const vx = target.x - me.position.x;
      const vz = target.z - me.position.z;
      const dist = Math.hypot(vx, vz);
      if (dist > CLICK_STEP) {
        target.x = me.position.x + vx / dist * CLICK_STEP;
        target.z = me.position.z + vz / dist * CLICK_STEP;
      }
      keepInWalkArea(target);
    }
    // 마우스와 휴대폰 터치 모두 pointerdown 하나로 처리한다(망원경 화면에서는 끌기, 별자리 잇기 중에는 별 고르기)
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (scopeOn) startScopeDrag(e);
      else if (linking) pickStar(e.clientX, e.clientY);
      else pickGround(e.clientX, e.clientY);
    });

    function updateMe(dt) {
      let step = SPEED * dt;
      let dx = 0, dz = 0;
      let kx = 0, kz = 0;   // kx: 화면 오른쪽, kz: 화면 위쪽
      if (keys.KeyW || keys.ArrowUp) kz += 1;
      if (keys.KeyS || keys.ArrowDown) kz -= 1;
      if (keys.KeyA || keys.ArrowLeft) kx -= 1;
      if (keys.KeyD || keys.ArrowRight) kx += 1;
      if (kx || kz) {
        // 카메라가 보는 방향을 바닥에 눕혀 화면 위쪽(f)을 구하고, 키를 그 기준으로 옮긴다
        let fx = me.position.x - camera.position.x;
        let fz = me.position.z - camera.position.z;
        const fl = Math.hypot(fx, fz) || 1;
        fx /= fl;
        fz /= fl;
        dx = fx * kz - fz * kx;
        dz = fz * kz + fx * kx;
        const len = Math.hypot(dx, dz);
        dx /= len;
        dz /= len;
      } else if (target) {
        const vx = target.x - me.position.x, vz = target.z - me.position.z;
        const d = Math.hypot(vx, vz);
        if (d < 0.05) {
          target = null;
        } else {
          dx = vx / d;
          dz = vz / d;
          step = Math.min(step, d);
        }
      }
      if (dx || dz) {
        const oldX = me.position.x, oldZ = me.position.z;
        me.position.x += dx * step;
        me.position.z += dz * step;
        keepInWalkArea(me.position);
        me.rotation.y = Math.atan2(dx, dz);
        // 불이나 가장자리에 막혀 거의 못 움직이면 목적지를 지운다
        const went = Math.hypot(me.position.x - oldX, me.position.z - oldZ);
        if (target && went < step * 0.1) target = null;
      }
    }

    // ---------- 카메라 ----------
    const CAM_BACK = 8, CAM_UP = 4.5;
    const CAM_TURN = 0.6;   // 카메라가 도는 가장 빠른 속도(1초에 약 35도), 어지럽지 않게 천천히
    let camYaw = 0;         // 망원경에서 본 카메라 쪽 방향(처음에는 +z 쪽)
    const camWant = new THREE.Vector3();
    function updateCamera(dt) {
      // 인형 뒤(망원경 반대편)에 카메라를 두어 망원경이 늘 화면에 들어오게 하되, 방향은 천천히 따라 돈다
      const wantYaw = Math.atan2(me.position.x, me.position.z);
      const diff = Math.atan2(Math.sin(wantYaw - camYaw), Math.cos(wantYaw - camYaw));   // -π~π 사이 차이
      const maxTurn = CAM_TURN * dt;
      camYaw += Math.max(-maxTurn, Math.min(maxTurn, diff * (1 - Math.exp(-2.5 * dt))));
      camWant.set(
        me.position.x + Math.sin(camYaw) * CAM_BACK,
        CAM_UP,
        me.position.z + Math.cos(camYaw) * CAM_BACK
      );
      camera.position.lerp(camWant, 1 - Math.exp(-3 * dt));
      camera.lookAt(me.position.x, 1.2, me.position.z);
    }

    // ---------- 별자리 잇기 ----------
    const LINK_COUNT = 10;    // 한 별자리에 잇는 별 수
    const LINK_LIFE = 10;     // 완성한 별자리가 보이는 시간(초)
    const LINK_FADE = 2;      // 사라지기 전에 흐려지는 시간(초)
    const PICK_PX = 28;       // 누른 곳에서 이 거리(px) 안의 별만 고른다
    const GOLD = 0xffcc44;
    const linkBtn = document.getElementById('linkBtn');
    const countEl = document.getElementById('count');
    const hintEl = document.getElementById('hint');
    const HINT_WALK = hintEl.textContent;

    // 오늘 만든 별자리 수: 날짜마다 따로 브라우저에 저장한다
    function getTodayKey() {
      const d = new Date();
      return 'space-constellations-' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function loadTodayCount() {
      try {
        return parseInt(localStorage.getItem(getTodayKey()) || '0', 10) || 0;
      } catch (e) {
        console.warn('오늘 만든 별자리 수를 읽지 못했습니다.', e);
        return 0;
      }
    }
    function saveTodayCount(n) {
      try {
        localStorage.setItem(getTodayKey(), String(n));
      } catch (e) {
        console.warn('오늘 만든 별자리 수를 저장하지 못했습니다.', e);
      }
    }
    // 저장소를 못 쓰는 브라우저에서도 열려 있는 동안은 숫자가 오르도록 메모리에도 둔다
    let todayCount = loadTodayCount();
    function showCount() {
      countEl.textContent = '오늘 만든 별자리 ' + todayCount + '개';
    }
    showCount();

    const screenPos = new THREE.Vector3();
    // 누른 화면 자리에서 가장 가까운 별을 찾는다(PICK_PX 밖이면 없음)
    function findStarAt(clientX, clientY) {
      let best = null;
      let bestD = PICK_PX;
      for (const star of pickableStars) {
        screenPos.copy(star).applyMatrix4(sky.matrixWorld).project(camera);
        if (screenPos.z > 1) continue;   // 카메라 뒤쪽 별
        const sx = (screenPos.x + 1) / 2 * innerWidth;
        const sy = (1 - screenPos.y) / 2 * innerHeight;
        const d = Math.hypot(sx - clientX, sy - clientY);
        if (d < bestD) {
          bestD = d;
          best = star;
        }
      }
      return best;
    }

    // 별자리 하나: 하늘 묶음에 붙여서 별과 함께 천천히 돈다
    function makeConstellation() {
      const group = new THREE.Group();
      const lineMat = new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, fog: false, depthWrite: false });
      const markMat = new THREE.PointsMaterial({
        color: GOLD, size: 3.6, map: glowTex, transparent: true, fog: false,
        depthWrite: false, blending: THREE.AdditiveBlending,
      });
      sky.add(group);
      return { group, lineMat, markMat, stars: [], endAt: 0 };
    }
    function addMark(c, star) {
      c.group.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints([star]), c.markMat));
    }
    // 두 별 사이에 가는 금색 막대를 놓아 선을 긋는다
    function addSegment(c, from, to) {
      const dir = to.clone().sub(from);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, dir.length(), 6), c.lineMat);
      bar.position.copy(from).add(to).multiplyScalar(0.5);
      bar.quaternion.setFromUnitVectors(up, dir.normalize());
      c.group.add(bar);
    }
    function removeConstellation(c) {
      sky.remove(c.group);
      c.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      c.lineMat.dispose();
      c.markMat.dispose();
    }

    let linking = false;      // 별자리 잇기 중인지
    let current = null;       // 지금 잇고 있는 별자리
    const finished = [];      // 다 이어서 사라지기를 기다리는 별자리
    let nowT = 0;             // 반복에서 받은 지금 시각(초)

    function updateLinkUi() {
      linkBtn.textContent = linking ? '잇기 취소' : '별자리 잇기';
      linkBtn.classList.toggle('on', linking);
      hintEl.textContent = linking
        ? '하늘의 별을 차례로 누르세요 (' + current.stars.length + '/' + LINK_COUNT + ')'
        : (scopeOn ? HINT_SCOPE : HINT_WALK);
    }
    function startLinking() {
      linking = true;
      current = makeConstellation();
      updateLinkUi();
    }
    function cancelLinking() {
      removeConstellation(current);
      current = null;
      linking = false;
      updateLinkUi();
    }
    function finishLinking() {
      current.endAt = nowT + LINK_LIFE;
      finished.push(current);
      current = null;
      linking = false;
      todayCount += 1;
      saveTodayCount(todayCount);
      showCount();
      playBell();
      updateLinkUi();
    }
    // 잇기 중에 화면을 누르면 별을 고른다
    function pickStar(clientX, clientY) {
      const star = findStarAt(clientX, clientY);
      if (!star) return;
      const stars = current.stars;
      const last = stars[stars.length - 1];
      if (star === last) return;   // 같은 별을 연달아 누르면 무시
      if (last) addSegment(current, last, star);
      addMark(current, star);
      stars.push(star);
      if (stars.length === LINK_COUNT) finishLinking();
      else updateLinkUi();
    }
    linkBtn.addEventListener('click', () => (linking ? cancelLinking() : startLinking()));

    // 완성한 별자리는 10초 동안 보이고, 마지막 2초 동안 흐려지며 사라진다
    function updateLinks(t) {
      nowT = t;
      // 망원경으로 확대해도 금색 선이 화면에서 비슷한 굵기로 보이게 한다
      const thick = camera.fov / WALK_FOV;
      for (const c of current ? [current, ...finished] : finished) {
        for (const o of c.group.children) {
          if (o.isMesh) o.scale.set(thick, 1, thick);
        }
      }
      for (let i = finished.length - 1; i >= 0; i--) {
        const c = finished[i];
        const left = c.endAt - t;
        if (left <= 0) {
          removeConstellation(c);
          finished.splice(i, 1);
          continue;
        }
        const opacity = Math.min(1, left / LINK_FADE);
        c.lineMat.opacity = opacity;
        c.markMat.opacity = opacity;
      }
    }

    // ---------- 망원경 보기 ----------
    const SCOPE_NEAR = 6;                               // 망원경에서 이 거리 안이면 버튼이 보인다
    const SCOPE_EYE = new THREE.Vector3(0, 2.4, 0);     // 접안렌즈 자리
    const WALK_FOV = camera.fov;
    const SCOPE_FOVS = [50, 30, 15, 6, 2];              // 확대 단계별 시야(도): 약 ×1, ×2, ×4, ×10, ×30
    const SCOPE_MIN_ALT = -88 * Math.PI / 180;          // 땅을 숨기므로 지평선 아래까지 내려 본다
    const TELESCOPE_MIN_ALT = 5 * Math.PI / 180;        // 나올 때 망원경 몸통은 이보다 낮게 숙이지 않는다
    const SCOPE_MAX_ALT = 88 * Math.PI / 180;
    const KEY_TURN = 0.7;                               // 방향키로 1초에 도는 각도(라디안, ×1 기준)
    const TAP_PX = 8;                                   // 이보다 덜 움직이면 끌기가 아니라 누르기
    const HINT_SCOPE = '끌어서 둘러보기 · 별자리를 누르면 이름';
    const LINE_COLOR = 0x7f9cff;                        // 별자리 선 평소 색
    const LINE_LIT_COLOR = 0xffe9a8;                    // 누른 별자리 선 색
    const NAME_SHOW = 3;                                // 별자리 이름이 떠 있는 시간(초)
    const NAME_PICK_PX = 30;                            // 누른 곳에서 이 거리(px) 안의 별자리 선을 고른다
    const scopeBtn = document.getElementById('scopeBtn');
    const zoomLabel = document.getElementById('zoomLabel');
    let scopeOn = false;
    let scopeAz = 0;      // 보는 방위(북 0, 동쪽으로 +)
    let scopeAlt = 0;     // 보는 고도
    let zoomLevel = 1;
    let drag = null;      // 끄는 중인 손가락·마우스 자리
    let scopeBtnShown = false;

    // 별자리 선: 하늘에 붙여 두고 망원경 화면에서만 은은하게 보인다
    const constellations = window.SKY_DATA.constellations.map((c) => {
      const pos = [];
      for (const path of c.lines) {
        for (let i = 0; i + 3 < path.length; i += 2) {
          const a = getSkyDir(path[i], path[i + 1]).multiplyScalar(STAR_R * 0.99);
          const b = getSkyDir(path[i + 2], path[i + 3]).multiplyScalar(STAR_R * 0.99);
          pos.push(a.x, a.y, a.z, b.x, b.y, b.z);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const line = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
        color: LINE_COLOR, transparent: true, opacity: 0.35, depthWrite: false, fog: false,
      }));
      line.visible = false;
      sky.add(line);
      return { id: c.id, ko: c.ko, label: getSkyDir(c.label[0], c.label[1]).multiplyScalar(STAR_R), line };
    });

    // ---- 별자리를 누르면 한글 이름 ----
    const conNameEl = document.getElementById('conName');
    let shownName = null;   // 지금 이름을 띄운 별자리 { ko, label, endAt }
    const segA = new THREE.Vector3();
    const segB = new THREE.Vector3();
    const labelPos = new THREE.Vector3();
    // 하늘 묶음 기준 자리를 화면 좌표(px)로 바꾼다. 카메라 뒤면 false(땅을 숨긴 망원경 화면에서 쓰므로 지평선 아래도 고른다)
    function getScreenPoint(local, out) {
      out.copy(local).applyMatrix4(sky.matrixWorld);
      out.project(camera);
      if (out.z > 1) return false;
      out.set((out.x + 1) / 2 * innerWidth, (1 - out.y) / 2 * innerHeight, 0);
      return true;
    }
    // 화면의 한 점에서 선분까지 거리(px)
    function getDistanceToSegment(px, py, a, b) {
      const vx = b.x - a.x;
      const vy = b.y - a.y;
      const len2 = vx * vx + vy * vy || 1;
      const k = Math.max(0, Math.min(1, ((px - a.x) * vx + (py - a.y) * vy) / len2));
      return Math.hypot(px - (a.x + vx * k), py - (a.y + vy * k));
    }
    // 누른 곳에서 가장 가까운 별자리 선을 찾는다(NAME_PICK_PX 밖이면 없음)
    function findConstellationAt(clientX, clientY) {
      let best = null;
      let bestD = NAME_PICK_PX;
      for (const c of constellations) {
        const p = c.line.geometry.attributes.position;
        for (let i = 0; i < p.count; i += 2) {
          if (!getScreenPoint(segA.fromBufferAttribute(p, i), segA)) continue;
          if (!getScreenPoint(segB.fromBufferAttribute(p, i + 1), segB)) continue;
          const d = getDistanceToSegment(clientX, clientY, segA, segB);
          if (d < bestD) {
            bestD = d;
            best = c;
          }
        }
      }
      return best;
    }
    // 같은 이름의 조각(뱀자리 머리·꼬리)까지 함께 밝히고 이름을 띄운다
    function lightConstellation(ko) {
      for (const c of constellations) {
        const lit = c.ko === ko;
        c.line.material.color.setHex(lit ? LINE_LIT_COLOR : LINE_COLOR);
        c.line.material.opacity = lit ? 0.95 : 0.35;
      }
    }
    function showConstellationName(c) {
      lightConstellation(c.ko);
      shownName = { ko: c.ko, label: c.label, endAt: nowT + NAME_SHOW };
      conNameEl.textContent = c.ko;
    }
    function hideConstellationName() {
      shownName = null;
      lightConstellation(null);
      conNameEl.style.display = 'none';
    }
    // 이름표는 별자리 이름 자리를 따라다니고, 3초가 지나면 사라진다
    function updateConstellationName() {
      if (!shownName) return;
      if (nowT > shownName.endAt) {
        hideConstellationName();
        return;
      }
      const onScreen = getScreenPoint(shownName.label, labelPos);
      conNameEl.style.display = onScreen ? 'block' : 'none';
      if (!onScreen) return;
      conNameEl.style.left = Math.max(70, Math.min(innerWidth - 70, labelPos.x)) + 'px';
      conNameEl.style.top = Math.max(80, Math.min(innerHeight - 140, labelPos.y)) + 'px';
    }

    const scopeTarget = new THREE.Vector3();
    function aimScopeCamera() {
      const cosAlt = Math.cos(scopeAlt);
      scopeTarget.set(Math.sin(scopeAz) * cosAlt, Math.sin(scopeAlt), -Math.cos(scopeAz) * cosAlt).add(SCOPE_EYE);
      camera.position.copy(SCOPE_EYE);
      camera.lookAt(scopeTarget);
    }
    function turnScope(dAz, dAlt) {
      scopeAz += dAz;
      scopeAlt = Math.max(SCOPE_MIN_ALT, Math.min(SCOPE_MAX_ALT, scopeAlt + dAlt));
    }
    // 확대 단계를 바꾼다
    function setZoom(level) {
      zoomLevel = Math.max(0, Math.min(SCOPE_FOVS.length - 1, level));
      zoomLabel.textContent = '×' + Math.max(1, Math.round(WALK_FOV / SCOPE_FOVS[zoomLevel]));
      updateStarLook();
    }
    // 망원경은 빛을 더 모으므로 별이 더 밝고 크게 보인다(확대할수록 더). 맨눈 화면은 원래대로
    function updateStarLook() {
      const gain = scopeOn ? 1 + zoomLevel / (SCOPE_FOVS.length - 1) : 0;   // 0(맨눈), 1(×1) ~ 2(×30)
      MAG_LAYERS.forEach((l, k) => {
        starLayers[k].material.size = l.size * (1 + 0.45 * gain);
        starLayers[k].material.opacity = Math.min(1, l.opacity + 0.2 * gain);
      });
    }
    // 세로 화면에서도 둥근 시야의 지름이 정한 시야각이 되도록 세로 시야각을 맞춘다
    function getScopeFov(level) {
      const want = SCOPE_FOVS[level] * Math.PI / 180;
      const aspect = Math.min(1, camera.aspect);
      return 2 * Math.atan(Math.tan(want / 2) / aspect) * 180 / Math.PI;
    }
    function showConstellationLines(show) {
      for (const c of constellations) c.line.visible = show;
    }
    // 지평선: 땅을 숨긴 망원경 화면에서 방향을 잃지 않게 옅은 선으로 둘러 그린다
    const horizonPoints = [];
    for (let i = 0; i < 128; i++) {
      const a = (i / 128) * Math.PI * 2;
      horizonPoints.push(new THREE.Vector3(Math.cos(a) * 88, SCOPE_EYE.y, Math.sin(a) * 88));
    }
    const horizonLine = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints(horizonPoints),
      new THREE.LineBasicMaterial({ color: 0x6f9a7a, transparent: true, opacity: 0.55, fog: false })
    );
    horizonLine.visible = false;
    scene.add(horizonLine);
    // 망원경 화면에서는 땅·먼 오름을 숨기고 지평선 선을 보인다
    function showLand(show) {
      ground.visible = show;
      farHills.visible = show;
      horizonLine.visible = !show;
    }
    // 들어갈 때는 망원경이 향한 쪽을 보고, 나올 때는 망원경이 마지막으로 본 쪽을 향하게 둔다
    function enterScope() {
      scopeOn = true;
      scopeAz = telescopeAz;
      scopeAlt = telescopeAlt;
      telescope.visible = false;
      me.visible = false;
      showLand(false);
      setZoom(1);
      showConstellationLines(true);
      document.body.classList.add('scope');
      scopeBtn.textContent = '망원경에서 나오기';
      aimScopeCamera();
      updateLinkUi();
    }
    function leaveScope() {
      scopeOn = false;
      drag = null;
      aimTelescope(scopeAz, Math.max(TELESCOPE_MIN_ALT, scopeAlt));
      telescope.visible = true;
      me.visible = true;
      showLand(true);
      setZoom(zoomLevel);
      hideConstellationName();
      showConstellationLines(false);
      camera.fov = WALK_FOV;
      camera.updateProjectionMatrix();
      document.body.classList.remove('scope');
      scopeBtn.textContent = '망원경 보기';
      updateLinkUi();
    }
    scopeBtn.addEventListener('click', () => (scopeOn ? leaveScope() : enterScope()));
    document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoomLevel + 1));
    document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoomLevel - 1));

    // 끌어서 둘러보기: 하늘을 잡아당기는 방향으로 움직인다. 거의 안 움직이고 떼면 누르기로 본다
    function startScopeDrag(e) {
      drag = { x: e.clientX, y: e.clientY, moved: 0 };
    }
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!scopeOn || !drag) return;
      const dx = e.clientX - drag.x;
      const dy = e.clientY - drag.y;
      drag.x = e.clientX;
      drag.y = e.clientY;
      drag.moved += Math.abs(dx) + Math.abs(dy);
      const perPx = camera.fov * Math.PI / 180 / innerHeight;
      turnScope(-dx * perPx, dy * perPx);
    });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!scopeOn || !drag) return;
      const tapped = drag.moved < TAP_PX;
      drag = null;
      if (!tapped) return;
      if (linking) {
        pickStar(e.clientX, e.clientY);
        return;
      }
      const c = findConstellationAt(e.clientX, e.clientY);
      if (c) showConstellationName(c);
    });
    renderer.domElement.addEventListener('pointercancel', () => { drag = null; });
    renderer.domElement.addEventListener('wheel', (e) => {
      if (!scopeOn) return;
      e.preventDefault();
      setZoom(zoomLevel + (e.deltaY < 0 ? 1 : -1));
    }, { passive: false });

    // 망원경 화면: 방향키로 돌리고, 시야를 확대 단계로 부드럽게 맞춘다
    function updateScope(dt) {
      const turn = KEY_TURN * dt * camera.fov / WALK_FOV;
      if (keys.KeyA || keys.ArrowLeft) turnScope(-turn, 0);
      if (keys.KeyD || keys.ArrowRight) turnScope(turn, 0);
      if (keys.KeyW || keys.ArrowUp) turnScope(0, turn);
      if (keys.KeyS || keys.ArrowDown) turnScope(0, -turn);
      camera.fov += (getScopeFov(zoomLevel) - camera.fov) * (1 - Math.exp(-8 * dt));
      camera.updateProjectionMatrix();
      aimScopeCamera();
      updateConstellationName();
    }
    // 망원경 가까이 있을 때만 버튼을 보인다
    function updateScopeButton() {
      const show = scopeOn || Math.hypot(me.position.x, me.position.z) < SCOPE_NEAR;
      if (show === scopeBtnShown) return;
      scopeBtnShown = show;
      scopeBtn.style.display = show ? 'block' : 'none';
    }

    // ---------- 소리 (Web Audio, 소리 파일 없음) ----------
    const soundBtn = document.getElementById('soundBtn');
    let audio = null;     // 처음 버튼을 누를 때 만든다
    let soundOn = false;

    function makeNoise(ctx, seconds) {
      const buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    // 밤바람: 잡음에서 낮은 소리만 남기고, 세기와 높이를 천천히 흔든다
    function startWind(ctx, out) {
      const noise = ctx.createBufferSource();
      noise.buffer = makeNoise(ctx, 4);
      noise.loop = true;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 420;
      lp.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.value = 0.16;
      const swell = ctx.createOscillator();     // 세기: 약 11초에 한 번 커졌다 작아진다
      swell.frequency.value = 0.09;
      const swellDepth = ctx.createGain();
      swellDepth.gain.value = 0.1;
      swell.connect(swellDepth).connect(gain.gain);
      const sweep = ctx.createOscillator();     // 높이: 약 20초에 한 번 오르내린다
      sweep.frequency.value = 0.05;
      const sweepDepth = ctx.createGain();
      sweepDepth.gain.value = 220;
      sweep.connect(sweepDepth).connect(lp.frequency);
      noise.connect(lp).connect(gain).connect(out);
      noise.start();
      swell.start();
      sweep.start();
    }

    // 풀벌레: 높은 음을 빠르게 끊어 "찌르르" 소리를 낸다. 마리마다 높이·박자·자리가 다르다
    const CRICKETS = [
      { freq: 4400, vol: 0.05, pan: -0.6, pulses: 3, gap: 0.42 },
      { freq: 4900, vol: 0.035, pan: 0.5, pulses: 4, gap: 0.55 },
      { freq: 5600, vol: 0.025, pan: 0.1, pulses: 12, gap: 1.6 },   // 길게 우는 먼 벌레
    ];
    const PULSE_STEP = 0.03;   // 한 번 "찌" 하는 간격(초)
    function startCricket(ctx, out, c) {
      const osc = ctx.createOscillator();
      osc.frequency.value = c.freq;
      const env = ctx.createGain();
      env.gain.value = 0;
      const pan = ctx.createStereoPanner();
      pan.pan.value = c.pan;
      osc.connect(env).connect(pan).connect(out);
      osc.start();
      let next = ctx.currentTime + 0.2 + Math.random();
      // 0.5초마다 앞으로 1.5초 안에 울 소리를 미리 적어 둔다(소리를 끄면 시간이 멈춰 더 적지 않는다)
      function scheduleChirps() {
        if (next < ctx.currentTime) next = ctx.currentTime + 0.05;
        while (next < ctx.currentTime + 1.5) {
          if (Math.random() < 0.12) {
            next += 1 + Math.random() * 2;   // 가끔 쉰다
            continue;
          }
          for (let i = 0; i < c.pulses; i++) {
            const t = next + i * PULSE_STEP;
            env.gain.setValueAtTime(0, t);
            env.gain.linearRampToValueAtTime(c.vol, t + 0.004);
            env.gain.linearRampToValueAtTime(0, t + 0.02);
          }
          next += c.pulses * PULSE_STEP + c.gap * (0.85 + Math.random() * 0.3);
        }
        setTimeout(scheduleChirps, 500);
      }
      scheduleChirps();
    }

    // 맑은 종소리: 배음 셋을 겹쳐 울리고 천천히 잦아들게 한다(소리가 꺼져 있으면 울리지 않는다)
    const BELL_BASE = 1046.5;   // 높은 도
    const BELL_PARTIALS = [
      { ratio: 1, vol: 0.22, len: 2.8 },
      { ratio: 2.76, vol: 0.09, len: 1.6 },
      { ratio: 5.4, vol: 0.04, len: 0.8 },
    ];
    function playBell() {
      if (!audio || !soundOn) return;
      const { ctx, master } = audio;
      const now = ctx.currentTime;
      for (const p of BELL_PARTIALS) {
        const osc = ctx.createOscillator();
        osc.frequency.value = BELL_BASE * p.ratio;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(p.vol, now + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, now + p.len);
        osc.connect(g).connect(master);
        osc.start(now);
        osc.stop(now + p.len + 0.05);
      }
    }

    function startAudio() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(ctx.destination);
      startWind(ctx, master);
      for (const c of CRICKETS) startCricket(ctx, master, c);
      return { ctx, master };
    }

    // 소리 켜기 버튼: 처음에는 무음, 누르면 켜지고 다시 누르면 꺼진다
    soundBtn.addEventListener('click', async () => {
      if (!audio) audio = startAudio();
      soundOn = !soundOn;
      if (soundOn) await audio.ctx.resume();
      else await audio.ctx.suspend();
      soundBtn.textContent = soundOn ? '소리 끄기' : '소리 켜기';
    });

    // ---------- 반복 ----------
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(clock.getDelta(), 0.1);
      const t = clock.elapsedTime;
      if (scopeOn) {
        updateScope(dt);
      } else {
        updateMe(dt);
        updateCamera(dt);
      }
      updateScopeButton();
      updateStars(t);
      updateLinks(t);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    camera.position.set(0, CAM_UP, 5 + CAM_BACK);
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
